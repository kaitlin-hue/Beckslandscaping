<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your quote · Beck’s Landscaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#15140f;--green:#3d5457;--green-2:#2c3d40;--sand:#c9a96e;--mut:#6f6b60;--line:#e2dcc9;--paper:#ffffff;--bad:#b4432f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:34px;width:auto;margin-top:6px}
.b1{display:block;font-weight:700;font-size:16px;line-height:1.15}
.b2{display:block;font-weight:500;font-size:16px;line-height:1.15;letter-spacing:-.025em;color:var(--green)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.meta{text-align:right;font-size:13px;color:var(--mut)}
.meta b{color:var(--ink);font-size:15px}
h1{font-size:30px;letter-spacing:-.03em;line-height:1.1;margin:28px 0 6px;font-weight:800}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:30px 0 10px;font-weight:700}
.muted{color:var(--mut)}
.intro{white-space:pre-wrap;margin:14px 0 0}
table{width:100%;border-collapse:collapse}
td{padding:10px 0;border-bottom:1px solid #f0ece2;vertical-align:top}
td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
.desc{font-size:13px;color:var(--mut)}
.sec td{border-bottom:0;padding-top:4px;font-size:13px;color:var(--mut)}
.totals{margin-top:18px;margin-left:auto;max-width:340px}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.totals .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:800;font-size:20px}
.dep{background:#f6f3ec;border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14px}
.days{padding-left:20px;margin:0}
.days li{margin:4px 0}
.box{border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:30px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;margin:12px 0 6px}
input[type=text]{width:100%;font:inherit;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;min-height:46px}
input[type=text]:focus{outline:3px solid rgba(201,169,110,.6);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:40px;border:0;background:var(--green-2);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--green-2);border:1.5px solid var(--green-2)}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.ok{background:#e9f1ec;border-radius:12px;padding:16px;margin-top:30px}
.terms{white-space:pre-wrap;font-size:13px;color:var(--mut)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.center{text-align:center;padding:30vh 16px;color:var(--mut)}
@media(max-width:560px){.meta{text-align:left}}
@media print{.noprint{display:none!important}.wrap{padding:0}body{font-size:12px}h1{margin-top:18px}}
</style>
</head>
<body>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'}):'';
const qty=(n,u)=>n&&!(+n===1&&!u)?`${+n} ${esc(u||'')}`:'';
const t=new URLSearchParams(location.search).get('t');
async function load(){
  const el=document.getElementById('q');
  if(!t){el.innerHTML='<div class="center">This quote link is missing its code. Call Greg on 0438 456 320.</div>';return}
  const {data:q,error}=await sb.rpc('get_quote',{p_token:t});
  if(error||!q){el.innerHTML='<div class="center">We couldn’t find this quote. Call Greg on 0438 456 320.</div>';return}
  const gst=q.subtotal*(+q.gst_rate||0.1),inc=q.subtotal+gst,dep=inc*(+q.deposit_pct||0)/100;
  const expired=q.valid_until&&q.valid_until<new Date().toISOString().slice(0,10);
  document.title=`Quote ${q.quote_no} · Beck’s Landscaping`;
  el.innerHTML=`<div class="top"><div class="brand"><img src="${ICON}" alt=""><div><span class="b1">BECK’S</span><span class="b2">LANDSCAPING</span></div></div>
   <div class="meta"><b>Quote ${esc(q.quote_no)}</b><br>${fmt(q.quote_date)}${q.valid_until?`<br>Valid until ${fmt(q.valid_until)}`:''}</div></div>
  <h1>${esc(q.title||'Your landscaping quote')}</h1>
  <div class="muted">Prepared for ${esc(q.client||'')}${q.suburb?` · ${esc([q.address,q.suburb].filter(Boolean).join(', '))}`:''}</div>
  ${q.intro?`<p class="intro">${esc(q.intro)}</p>`:''}
  <h2>What’s included</h2>
  <table>${(q.sections||[]).map(s=>`<tr class="sec"><td colspan="2">${esc(s.kind)}</td></tr>${(s.lines||[]).map(l=>`<tr><td><div>${esc(l.item)}${qty(l.qty,l.unit)?` <span class="muted">· ${qty(l.qty,l.unit)}</span>`:''}</div>${l.description?`<div class="desc">${esc(l.description)}</div>`:''}</td><td class="amt">${money(l.amount)}</td></tr>`).join('')}`).join('')}</table>
  <div class="totals"><div><span>Subtotal</span><span>${money(q.subtotal)}</span></div><div><span>GST</span><span>${money(gst)}</span></div><div class="grand"><span>Total</span><span>${money(inc)}</span></div></div>
  ${q.deposit_pct?`<div class="dep"><b>${+q.deposit_pct}% deposit: ${money(dep)}</b> inc GST secures your start date. We’ll send the deposit invoice once you accept.</div>`:''}
  ${(q.days||[]).length?`<h2>How the build runs</h2><ol class="days">${q.days.map(d=>`<li>${esc(d.title||'')}</li>`).join('')}</ol><p class="muted" style="font-size:13px">About ${q.days.length} working ${q.days.length===1?'day':'days'} on site${q.crew_size?` with a crew of ${q.crew_size}`:''}, weather permitting.</p>`:''}
  ${q.exclusions?`<h2>Not included</h2><p class="intro" style="margin:0">${esc(q.exclusions)}</p>`:''}
  ${q.terms?`<h2>Terms</h2><p class="terms">${esc(q.terms)}</p>`:''}
  <div id="acc"></div>
  <div class="row noprint"><button class="btn ghost" onclick="print()">Save as PDF or print</button><a class="btn ghost" href="tel:+61438456320">Call Greg</a></div>
  <div class="foot"><span>Beck’s Landscaping · Perth, WA · Designed to last. Built to live in.</span><span>0438 456 320 · contact@beckslandscaping.com.au</span></div>`;
  const acc=document.getElementById('acc');
  if(q.accepted_at){acc.innerHTML=`<div class="ok"><b>Accepted by ${esc(q.accepted_name||'')} on ${fmt(String(q.accepted_at).slice(0,10))}.</b><br>Thanks. Greg will be in touch to lock in your start date.</div>`;return}
  if(expired){acc.innerHTML='<div class="box"><b>This quote has expired.</b><p class="muted">Prices can move. Call Greg on 0438 456 320 for an updated quote.</p></div>';return}
  acc.innerHTML=`<div class="box noprint"><h2 style="margin-top:0">Happy to go ahead?</h2><p class="muted" style="margin:0">Type your name to accept this quote. Greg gets it straight away.</p>
   <label for="nm">Your full name</label><input type="text" id="nm" autocomplete="name">
   <label class="check"><input type="checkbox" id="ag"><span>I accept this quote${q.terms?' and the terms above':''}.</span></label>
   <div class="row"><button class="btn" id="go">Accept the quote</button></div><div class="err" id="er" role="alert"></div></div>`;
  document.getElementById('go').onclick=async()=>{const nm=document.getElementById('nm').value.trim(),er=document.getElementById('er');er.textContent='';
    if(!nm)return er.textContent='Please type your name.';if(!document.getElementById('ag').checked)return er.textContent='Please tick the box to accept.';
    const b=document.getElementById('go');b.disabled=true;b.textContent='Accepting';
    const {error}=await sb.rpc('accept_quote',{p_token:t,p_name:nm});
    if(error){b.disabled=false;b.textContent='Accept the quote';return er.textContent=error.message||'That didn’t go through. Call Greg on 0438 456 320.'}
    load()};
}
load();
</script>
