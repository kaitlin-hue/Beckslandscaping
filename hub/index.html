<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2c3d40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beck's Hub">
<title>Beck's Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15140f;--charcoal:#2b2f2a;--green:#3d5457;--green-2:#2c3d40;--green-l:#a9bcbe;--green-xl:#e3eaeb;
  --paper:#ffffff;--card:#fff;--line:#e2dcc9;--mut:#8a8577;--sand:#c9a96e;
  --good:#3f7a4f;--warn:#b7791f;--bad:#b4432f;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.brand b,.ph-title{font-family:Montserrat,-apple-system,BlinkMacSystemFont,sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:24px;font-weight:700;letter-spacing:-.03em}h2{font-size:17px;font-weight:700;letter-spacing:-.01em}h3{font-size:15px;font-weight:600}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:820px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1}.brandwrap{display:flex;align-items:center;gap:10px}.brandwrap img{width:30px;height:30px;object-fit:contain}.brandwrap.inv img{filter:invert(1) brightness(1.6)}
.brand b{font-weight:800;letter-spacing:.04em;font-size:15px}.brand span{font-size:10px;letter-spacing:.24em;color:var(--mut);margin-top:3px}
.who{background:var(--green-xl);border:0;color:var(--green-2);border-radius:40px;padding:7px 12px;font-size:13px;cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(21,20,15,.03)}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--mut)}.small{font-size:13px}.tiny{font-size:11px}
.btn{border:0;border-radius:40px;padding:12px 18px;font-weight:600;background:var(--green);color:#fff;cursor:pointer;font-size:14px}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--green-2);border:1.5px solid var(--green)}
.btn.light{background:var(--green-xl);color:var(--green-2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-l);border-color:var(--green)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--green-xl);color:var(--green-2);white-space:nowrap}
.pill.warn{background:#f6ead2;color:#7d5410}.pill.bad{background:#f5ddd7;color:var(--bad)}.pill.good{background:#dfeedd;color:var(--good)}.pill.grey{background:#eeebe3;color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 8px;cursor:pointer;min-width:58px}
nav.tabs button.on{color:var(--green-2);font-weight:700}
nav.tabs svg{width:22px;height:22px}
nav.tabs .add{background:var(--green);color:#fff;border-radius:50%;width:56px;height:56px;min-width:56px;margin-top:-24px;box-shadow:0 6px 16px rgba(44,61,64,.35);justify-content:center}
nav.tabs .add span{display:none}
.job{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.stagebar{display:flex;gap:3px;margin:10px 0 2px}.stagebar i{flex:1;height:5px;border-radius:3px;background:#ebe7dc}.stagebar i.on{background:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:Georgia,serif;font-size:28px;line-height:1.1;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.35}
.kpi.alert{border-color:#e9c7bf;background:#fdf6f4}.kpi.alert .v{color:var(--bad)}
.hero{background:var(--green-2);color:#fff;border-radius:16px;padding:20px;margin:12px 0;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--green-l)}
.hero .big{font-family:Georgia,serif;font-size:40px;line-height:1.05;margin:6px 0}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(169,188,190,.25),transparent 70%)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid #ece9e1;vertical-align:top}
td input{padding:6px 8px;font-size:13px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cp{display:flex;gap:12px;align-items:flex-start;position:relative;padding:5px 0}
.cp .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;z-index:1}
.cp.done .dot{background:var(--green);border-color:var(--green)}.cp.next .dot{border-color:var(--green)}
.cp:not(:last-child)::after{content:"";position:absolute;left:10px;top:27px;bottom:-5px;width:2px;background:var(--line)}
.cp.done:not(:last-child)::after{background:var(--green)}
.gantt{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
.g-hdr{display:flex;position:sticky;top:0;background:#faf8f2;border-bottom:1px solid var(--line)}
.g-day{flex:none;text-align:center;font-size:10px;color:var(--mut);border-left:1px solid #ece9e1;padding:4px 0;line-height:1.25}
.g-day.we{background:#f3f0e8}.g-day.today{color:var(--bad);font-weight:700}
.g-row{display:flex}
.g-lab{position:sticky;left:0;z-index:2;background:#fff;width:128px;flex:none;padding:6px 8px;font-size:12px;font-weight:600;border-right:1px solid var(--line);height:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.g-lab small{display:block;font-weight:400;color:var(--mut)}
.g-lane{position:relative;height:46px;border-bottom:1px solid #ece9e1;flex:none}
.g-bar{position:absolute;top:10px;height:26px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.g-bar.pencil{background:repeating-linear-gradient(45deg,#c9a96e 0 6px,#d6bb87 6px 12px);color:#3b2d12}
.g-bar.drag,.g-promise.drag{cursor:grab;touch-action:pan-y;user-select:none}.g-bar.lift,.g-promise.lift{cursor:grabbing;box-shadow:0 6px 16px rgba(21,20,15,.25);z-index:3}
.g-promise{position:absolute;top:6px;bottom:6px;border-radius:7px;background:rgba(201,169,110,.18);border:1.5px dashed var(--sand);font-size:11px;font-weight:600;color:#6b5527;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-promise.late{background:rgba(180,67,47,.10);border-color:var(--bad);color:var(--bad)}
.g-bar.booked{background:var(--green)}.g-bar.onsite{background:var(--green-2)}.g-bar.done{background:#8d9a97}
.g-cap{height:34px}
.g-cap i{position:absolute;bottom:4px;width:calc(100% - 4px);border-radius:3px 3px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.wk{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:#fff}
.wk .bar{height:46px;background:#f1efe9;border-radius:6px;position:relative;overflow:hidden;margin:6px 0}
.wk .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--green)}
.wk .bar i.over{background:var(--bad)}
.wk b{display:block;font-size:12px}.wk span{font-size:10px;color:var(--mut)}
.chart{width:100%;max-width:560px;height:auto;display:block}
.chart text{font-size:11px;fill:var(--mut)}
.chart .lbl{fill:var(--ink);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:30;opacity:0;transition:opacity .12s;max-width:240px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.spinner{width:28px;height:28px;border:3px solid var(--green-xl);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.recorder{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 16px}
.bigmic{width:92px;height:92px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(44,61,64,.3)}
.bigmic.live{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,67,47,.5)}100%{box-shadow:0 0 0 22px rgba(180,67,47,0)}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.q{background:#f6ead2;border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:40px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.seg{display:flex;background:#f1efe9;border-radius:40px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:40px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.camp{border-left:3px solid var(--green);padding:8px 0 8px 12px;margin:8px 0}
.camp.push{border-color:var(--sand)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,rgba(44,61,64,.82),rgba(21,20,15,.92)),url('https://nwpperddaojaafsyuqyx.supabase.co/storage/v1/object/public/site/burwood/render.webp') center/cover}
.login .card{max-width:380px;width:100%}
.hidden{display:none!important}

/* ---------- today ---------- */
.today-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.today-head h1{font-size:26px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr);gap:14px}}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column}
.tile.dark{background:var(--green-2);border-color:var(--green-2);color:#fff}
.tile.dark .eyebrow{color:var(--sand)}.tile.dark .s,.tile.dark .src{color:#c9d3d2}
.tile .v{font-family:Georgia,serif;font-size:32px;line-height:1.1;margin-top:8px}
.tile .v.bad{color:var(--bad)}
.tile .s{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.35}
.tile .src{font-size:11px;color:var(--mut);margin-top:auto;padding-top:12px}
.meter{height:8px;border-radius:5px;background:#efe9dd;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--green-2)}
.today-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.today-grid{grid-template-columns:1fr 1fr;gap:14px}.today-grid .card{margin:0}}
.need{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;margin:8px 0;border:0;border-radius:12px;background:#f6f4ee;text-align:left;cursor:pointer;min-height:56px}
.need:hover{filter:brightness(.98)}
.need.info{background:var(--green-xl)}.need.bad{background:#f5ddd7}
.need .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)}
.need.info .dot{background:var(--green)}.need.bad .dot{background:var(--bad)}
.need .txt{flex:1;min-width:0}.need .txt b{display:block;font-size:14px}.need .txt span{display:block;font-size:13px;color:#5f5b50;margin-top:2px}
.need .go{font-weight:700;font-size:13px;color:var(--green-2);white-space:nowrap}
.stg{display:flex;align-items:center;gap:10px;margin:8px 0}
.stg .n{width:118px;font-size:13px;font-weight:600;flex:none}
.stg .t{flex:1;height:12px;background:#ece9e1;border-radius:6px;overflow:hidden}
.stg .t i{display:block;height:100%;border-radius:6px;min-width:0}
.stg .c{width:34px;text-align:right;font-family:Georgia,serif;font-size:15px;flex:none}

/* ---------- talk into any box, day log, toolbox ---------- */
.micwrap{position:relative;display:block}
.micwrap textarea,.micwrap input{padding-right:52px}
.minimic{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:50%;border:0;background:var(--green-xl);color:var(--green-2);display:grid;place-items:center;cursor:pointer}
.minimic svg{width:20px;height:20px}
.minimic.live{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.dayrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 0;border-bottom:1px solid #ece9e1}
.dayrow label{margin-top:0}
.dayrow .f-name{grid-column:span 2}.dayrow .f-job{grid-column:span 4}
.dayrow .f-t,.dayrow .f-h{grid-column:span 2}
.dayrow .f-x{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.chk{display:flex!important;gap:8px;align-items:center;font-weight:500;color:var(--ink)!important;margin:0!important}
.chk input{width:auto}
@media(min-width:900px){.dayrow{grid-template-columns:1.2fr 2fr .8fr .8fr .6fr 1.1fr;align-items:end}.dayrow>div{grid-column:auto!important}.dayrow .f-x{flex-direction:column;align-items:flex-start;gap:6px}}
.issrow{padding:12px 0;border-bottom:1px solid #ece9e1}
.tb-item{border-left:3px solid var(--warn);padding:10px 0 10px 12px;margin:8px 0}
.tb-item.discussed{border-color:var(--green)}.tb-item.sorted{border-color:var(--good);opacity:.7}

/* ---------- desktop: sidebar layout ---------- */
nav.tabs .nav-brand,nav.tabs .nav-foot,nav.tabs button.desk{display:none}
@media(min-width:1000px){
  header.top{display:none}
  .app{max-width:none;margin:0 0 0 248px;padding:12px clamp(24px,4vw,56px) 64px}
  #main{max-width:1120px}
  nav.tabs{top:0;bottom:0;right:auto;width:248px;flex-direction:column;justify-content:flex-start;gap:4px;background:#fff;border-top:0;border-right:1px solid var(--line);padding:28px 16px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;width:100%;min-height:44px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--charcoal)}
  nav.tabs button:hover{background:var(--green-xl);color:var(--green-2)}
  nav.tabs button.on{background:var(--green-2);color:#fff;font-weight:700}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs .add{order:90;margin-top:auto;width:100%;min-width:0;height:48px;border-radius:12px;background:var(--green);color:#fff;box-shadow:none;justify-content:center;font-weight:700}
  nav.tabs .add:hover{background:var(--green-2);color:#fff}
  nav.tabs .add span{display:inline}
  nav.tabs button.desk{display:flex}
  nav.tabs .nav-brandwrap{display:flex;order:-1;padding:0 10px 22px}nav.tabs .nav-brandwrap img{width:38px;height:38px}nav.tabs .nav-brand{display:flex;padding:0}
  nav.tabs .nav-brand b{color:var(--ink);font-size:18px}nav.tabs .nav-brand span{color:var(--mut);font-size:11px;letter-spacing:.28em}
  nav.tabs .nav-foot{display:flex;order:99;min-height:40px;font-size:13px;font-weight:500;color:var(--mut);margin-top:8px}
  .toast{bottom:32px;left:calc(50% + 124px)}
}

/* ---------- elevated layer: photo heroes, folding cards, gestures ---------- */
nav.tabs .nav-brand .b2{letter-spacing:.01em;font-size:15px;color:var(--charcoal);margin-top:2px}nav.tabs .nav-brand .b2+span{margin-top:4px}
.brand b{font-weight:800;letter-spacing:.02em}.brand .b2{font-weight:500;letter-spacing:.01em;font-size:13px;color:var(--charcoal);margin-top:1px;text-transform:none}
.ph{position:relative;margin:14px 0 6px;border-radius:20px;overflow:hidden;min-height:190px;background:#2b2f2a center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 20px 18px;isolation:isolate;transition:min-height .35s ease,padding .35s ease}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,20,15,.05) 0%,rgba(21,20,15,.15) 40%,rgba(21,20,15,.72) 100%);z-index:-1}
.ph .ph-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.88);position:absolute;top:18px;left:20px}
.ph h1{color:#fff;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:0}
.ph .row.between{margin:0!important;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph .muted,.ph .small{color:rgba(255,255,255,.85)!important}
.ph .eyebrow{color:rgba(255,255,255,.88)!important}
.ph .btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph .btn:not(.light){background:var(--green);border-color:var(--green)}
.ph.slim{min-height:84px;padding:16px 20px}.ph.slim .ph-eyebrow{display:none}.ph.slim h1{font-size:22px}
.ph .ph-grip{position:absolute;top:10px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:rgba(255,255,255,.55)}
@media(min-width:1000px){.ph{min-height:230px;padding:28px 30px 24px}.ph .ph-eyebrow{left:30px;top:24px}.ph .ph-grip{display:none}}
.card.foldable>.fold-head{cursor:pointer;user-select:none;gap:10px}.card.foldable>.fold-head>:first-child{margin-right:auto}
.card.foldable>.fold-head::after{content:"";width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:0 4px 4px 10px;transition:transform .25s ease;flex:none}
.card.foldable.folded>.fold-head::after{transform:rotate(-45deg);margin-bottom:0}
.card.foldable>.fold-body{overflow:hidden;transition:max-height .3s ease,opacity .25s ease}
.card.foldable.folded>.fold-body{max-height:0!important;opacity:0}
.card.foldable.folded{padding-bottom:16px}
#main{will-change:transform}
#main.in-r{animation:inR .28s cubic-bezier(.2,.8,.2,1)}#main.in-l{animation:inL .28s cubic-bezier(.2,.8,.2,1)}#main.in-up{animation:inUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(38px);opacity:.2}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-38px);opacity:.2}to{transform:none;opacity:1}}
@keyframes inUp{from{transform:translateY(26px);opacity:.2}to{transform:none;opacity:1}}
.swipe-hint{position:fixed;top:50%;z-index:20;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--green-2);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
@media(prefers-reduced-motion:reduce){#main.in-r,#main.in-l,#main.in-up{animation:none}.ph,.card.foldable>.fold-body{transition:none}}

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://nwpperddaojaafsyuqyx.supabase.co","sb_publishable_cONDiKoAkuwQQMv9x8zVag_M-Xd2Wa6");

const STAGES=['Lead','Design','Quoted','Accepted','Deposit in','Materials ordered','On site','Complete','Invoiced','Paid'];
const BOOKED=['Accepted','Deposit in','Materials ordered','On site'];
const PENCIL=['Lead','Design','Quoted'];
const S={user:null,profile:null,view:'jobs',jobs:[],tasks:[],rates:[],settings:{},crew:[],crewDays:[],costs:[],camps:[],cps:[],leads:[],issues:[],addMode:'day',dayDraft:null,finSet:null,finUntil:0,dbReady:false,plan:[],qlines:[],orders:[],suppliers:[],v3:null,planDraft:null,draft:null,jobId:null};
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,dp=0)=>n==null||isNaN(n)?'–':(n<0?'-':'')+'$'+Math.abs(+n).toLocaleString('en-AU',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const r1=n=>Math.round((+n||0)*10)/10;
const pct=n=>isFinite(n)?Math.round(n*100)+'%':'–';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),Math.max(2600,m.length*55))}
const role=()=>S.profile?.role;
const isStaff=()=>['owner','admin'].includes(role());
const isMkt=()=>role()==='marketing';
const DAY_RATE=()=>+(S.settings.labour_rate||75)*(+(S.settings.hours_per_day)||8);

/* ---------- dates ---------- */
const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const isWork=d=>(S.settings.work_days||[1,2,3,4,5]).includes(d.getDay()===0?7:d.getDay());
const nextWork=d=>{const x=new Date(d);while(!isWork(x))x.setDate(x.getDate()+1);return x};
function nthWorkDay(start,n){let x=nextWork(start);for(let i=0;i<n;i++){x.setDate(x.getDate()+1);x=nextWork(x)}return x}
const addWorkDays=(start,n)=>nthWorkDay(start,Math.max(1,Math.ceil(n))-1);
const fmtD=s=>s?parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtShort=s=>s?parse(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'';
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function workDaysBetween(a,b){let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(isWork(d))n++;return n}
const jobHours=ts=>ts.reduce((a,t)=>a+(+t.est_hours||0),0);
function jobDays(ts,crew){return Math.max(1,Math.ceil(jobHours(ts)/((crew||S.settings.default_crew||2)*(S.settings.hours_per_day||8))))}
function layoutTasks(job,tasks){const hpd=S.settings.hours_per_day||8,start=parse(job.start_date);let cum=0;
  for(const t of tasks){const crew=t.crew_size||job.crew_size||S.settings.default_crew||2;const days=(+t.est_hours||0)/(crew*hpd);
    const a=Math.floor(cum+1e-6),b=Math.max(a,Math.ceil(cum+days-1e-6)-1);t.start_date=iso(nthWorkDay(start,a));t.end_date=iso(nthWorkDay(start,b));cum+=days}return tasks}

/* ---------- capacity ---------- */
function activeCrew(){return Math.max(1,S.crew.filter(c=>c.active!==false).length)}
function bookedCrewOn(d,{includePencil=false}={}){let n=0;const ds=iso(d);
  for(const j of S.jobs){if(!j.start_date||!j.end_date)continue;const ok=BOOKED.includes(j.stage)||(includePencil&&PENCIL.includes(j.stage));if(!ok)continue;
    if(ds>=j.start_date&&ds<=j.end_date)n+=(j.crew_size||S.settings.default_crew||2)}return n}
function weeksAhead(n=12){const out=[];let m=monday(today0());if(!isWork(today0())&&today0().getDay()===0)m.setDate(m.getDate()+7);
  for(let w=0;w<n;w++){const ws=new Date(m);ws.setDate(ws.getDate()+w*7);let cap=0,booked=0,pencil=0;
    for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(!isWork(d)||d<today0())continue;cap+=activeCrew();const b=bookedCrewOn(d);booked+=Math.min(b,activeCrew());pencil+=Math.min(bookedCrewOn(d,{includePencil:true}),activeCrew())-Math.min(b,activeCrew())}
    out.push({ws,cap,booked,pencil,free:Math.max(0,cap-booked-pencil),fill:cap?booked/cap:0})}return out}
function avgJobCrewDays(){const done=jobNumbers().filter(n=>n.actualDays>0);if(done.length)return done.reduce((a,n)=>a+n.actualDays,0)/done.length;
  const q=S.jobs.map(j=>jobHours(tasksFor(j.id))/(S.settings.hours_per_day||8)).filter(x=>x>0);return q.length?q.reduce((a,b)=>a+b,0)/q.length:8}
function nextFreeStart(excludeId,crewNeed){crewNeed=crewNeed||S.settings.default_crew||2;let d=nextWork(new Date(today0().getTime()+864e5));
  for(let i=0;i<180;i++){if(isWork(d)&&activeCrew()-bookedCrewOn(d,{includePencil:true})>=crewNeed)return d;d.setDate(d.getDate()+1)}return d}

/* ---------- data ---------- */
async function loadAll(){
  const q={settings:sb.from('settings').select('*').single(),crew:sb.from('crew').select('*').order('name')};
  if(isStaff()){
    q.jobs=sb.from('jobs').select('*, clients(name,phone,email)').order('created_at',{ascending:false});
    q.tasks=sb.from('job_tasks').select('*').order('seq');
    q.rates=sb.from('rates').select('*').order('task_type');q.crewDays=sb.from('crew_days').select('*').order('work_date');q.costs=sb.from('job_costs').select('*');
    q.cps=sb.from('checkpoints').select('job_id,stage,done_at').order('done_at');
    q.finSet=sb.rpc('finance_password_set');
    q.issues=sb.from('issues').select('*').order('created_at',{ascending:false}).limit(300);
    q.plan=sb.from('job_plan_days').select('*').order('day_no');q.qlines=sb.from('quote_lines').select('*').order('seq');
    q.orders=sb.from('purchase_orders').select('*').order('created_at');q.suppliers=sb.from('suppliers').select('*').order('name');
    q.clients=sb.from('clients').select('*').order('name');q.brain=sb.from('brain').select('*').order('created_at',{ascending:false}).limit(300);q.cnotes=sb.from('client_notes').select('*').order('created_at',{ascending:false});
    q.alog=sb.from('automation_log').select('*').or(`needs_check.eq.true,created_at.gte.${new Date(Date.now()-14*864e5).toISOString()}`).order('created_at',{ascending:false}).limit(100);
  }else{
    // crew and marketing: board data with no money. Falls back to the tables until the database update has run.
    q.jobs=sb.rpc('board_jobs');q.tasks=sb.rpc('board_tasks');
  }
  if(isStaff()||isMkt()){q.camps=sb.from('campaigns').select('*').order('week_start');q.leads=sb.rpc('marketing_leads')}
  const keys=Object.keys(q),res=await Promise.all(Object.values(q));
  for(let i=0;i<keys.length;i++){const k=keys[i],r=res[i];
    if(r.error&&(k==='jobs'||k==='tasks')&&!isStaff()){const f=k==='jobs'?await sb.from('jobs').select('id,stage,suburb,title,start_date,end_date,crew_size,created_at').order('created_at',{ascending:false}):await sb.from('job_tasks').select('id,job_id,seq,task_type,est_hours,crew_size,start_date,end_date').order('seq');S[k]=f.data||[];continue}
    if(k==='finSet'){S.finSet=r.error?null:!!r.data;continue}
    if(k==='leads'&&r.error){S.leads=null;continue}
    if(k==='issues'&&r.error){S.issues=null;continue}
    if(k==='plan'){S.v3=!r.error;S.plan=r.data||[];continue}
    if(['qlines','orders','suppliers','alog','clients','cnotes','brain'].includes(k)&&r.error){S[k]=[];continue}
    S[k]=r.data||(k==='settings'?{}:[]);
  }
  S.dbReady=isStaff()?S.finSet!==null:true;
}
const tasksFor=id=>S.tasks.filter(t=>t.job_id===id).sort((a,b)=>a.seq-b.seq);
const daysFor=id=>S.crewDays.filter(d=>d.job_id===id);
const costsFor=id=>S.costs.filter(c=>c.job_id===id);

/* ---------- the numbers ---------- */
function numbersFor(j){
  const ts=tasksFor(j.id),cd=daysFor(j.id),hpd=S.settings.hours_per_day||8;
  const quoteEx=j.quote_total?j.quote_total/1.1:ts.reduce((a,t)=>a+(+t.sell_price||0),0)||null;
  const qLabour=j.quoted_labour!=null?+j.quoted_labour:(jobHours(ts)*(+S.settings.labour_rate||0)||null);
  const qDays=j.quoted_crew_days!=null?+j.quoted_crew_days:(qLabour?qLabour/DAY_RATE():jobHours(ts)/hpd);
  const actualDays=cd.reduce((a,d)=>a+(+d.hours||0),0)/hpd;
  const varDays=cd.filter(d=>d.is_variation).reduce((a,d)=>a+(+d.hours||0),0)/hpd;
  const actualCharge=cd.reduce((a,d)=>a+(+d.charge||0),0);
  const actualCost=cd.reduce((a,d)=>a+(+d.cost||0),0);
  const lostDays=actualDays?Math.max(0,actualDays-varDays-(qDays||0)):0;
  const lostDollars=lostDays*DAY_RATE();
  const mats=costsFor(j.id).reduce((a,c)=>a+(+c.amount||0),0);
  // Job profit: what the client pays ex GST, minus materials, minus what the crew cost to pay.
  const revenueEx=j.invoiced_total?j.invoiced_total/1.1:quoteEx;
  const taskMats=ts.reduce((a,t)=>a+(+t.material_cost||0),0);
  const matsUsed=mats||(j.quoted_materials!=null?+j.quoted_materials:taskMats)||0;
  const matsSource=mats?'supplier costs':j.quoted_materials!=null?'materials in the quote':taskMats?'task materials':'no materials';
  let labourCost=0,costKnown=cd.length>0;
  for(const d of cd){if(d.cost!=null&&d.cost!==''){labourCost+=+d.cost;continue}
    const c=S.crew.find(x=>x.id===d.crew_id);if(c&&c.cost_per_day!=null&&c.cost_per_day!==''){labourCost+=+c.cost_per_day*(+d.hours||0)/hpd}else costKnown=false}
  const profit=costKnown&&revenueEx?revenueEx-matsUsed-labourCost:null;
  return {j,quoteEx,qLabour,qDays,actualDays,varDays,actualCharge,actualCost,lostDays,lostDollars,mats,revenueEx,matsUsed,matsSource,labourCost,profit,margin:profit!=null&&revenueEx?profit/revenueEx:null,
    perDay:actualDays&&quoteEx?quoteEx/actualDays:null,overrun:qDays&&actualDays?(actualDays-varDays)/qDays-1:null};
}
function jobNumbers(){return S.jobs.map(numbersFor)}

/* ---------- timing: replies, quotes, promised start windows ---------- */
const OPEN=['Lead','Design','Quoted','Accepted','Deposit in','Materials ordered','On site'];
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const dayOf=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function enteredStage(j,stage){const c=(S.cps||[]).filter(c=>c.job_id===j.id&&c.stage===stage).pop();return c?dayOf(c.done_at):(stage==='Lead'?dayOf(j.created_at):null)}
function replyStatus(j){
  if(j.stage!=='Lead'||j.contacted_at)return null;
  const since=dayOf(j.created_at),due=addDays(since,+(S.settings.reply_due_days??2)),left=daysBetween(today0(),due);
  return {due,left,late:left<0}}
function quoteStatus(j){
  if(!['Lead','Design'].includes(j.stage)||j.quote_date)return null;
  const from=j.stage==='Design'?(enteredStage(j,'Design')||dayOf(j.created_at)):dayOf(j.created_at);
  const due=addDays(from,+(S.settings.quote_due_days??7)),left=daysBetween(today0(),due);
  return {from,due,left,late:left<0,soon:left>=0&&left<=2}}
function promiseOf(j){
  if(!j.promised_on||!j.promised_weeks_min)return null;
  const on=parse(j.promised_on),from=addDays(on,7*j.promised_weeks_min),to=addDays(on,7*(j.promised_weeks_max||j.promised_weeks_min));
  const t0=today0(),warn=+(S.settings.promise_warn_days??14);
  let state='ok',msg='';
  if(!OPEN.includes(j.stage)||j.stage==='On site'){state='done'}
  else if(j.start_date&&parse(j.start_date)>to){state='late';msg=`Booked to start ${fmtD(j.start_date)}, after the ${fmtShort(iso(to))} promise`}
  else if(!j.start_date&&t0>to){state='late';msg=`Promised by ${fmtShort(iso(to))}. Not on the board`}
  else if(!j.start_date&&daysBetween(t0,from)<=warn){state='soon';msg=`Window opens ${fmtShort(iso(from))}. Not on the board yet`}
  else if(j.start_date){state='booked';msg=`Starts ${fmtD(j.start_date)}, inside the promise`}
  else{msg=`Window ${fmtShort(iso(from))} to ${fmtShort(iso(to))}`}
  return {on,from,to,state,msg,label:`${j.promised_weeks_min}${j.promised_weeks_max&&j.promised_weeks_max!==j.promised_weeks_min?' to '+j.promised_weeks_max:''} weeks`}}
function nameOf(j){return isMkt()?(j.suburb||'Job'):(j.clients?.name||j.suburb||'No name')}
function timingAlerts(){
  const out=[];
  for(const j of S.jobs){
    const p=promiseOf(j);if(p&&p.state==='late')out.push({lvl:'bad',kind:'promise',j,t:`Start date promise missed · ${esc(nameOf(j))}`,s:p.msg});
    const r=replyStatus(j);if(r&&r.left<=0)out.push({lvl:r.late?'bad':'warn',kind:'reply',j,t:`Reply to ${esc(nameOf(j))}`,s:`Enquired ${fmtShort(iso(dayOf(j.created_at)))}${r.late?`. ${-r.left} day${r.left===-1?'':'s'} overdue`:'. Due today'}`});
    const q=quoteStatus(j);if(q&&(q.late||q.soon))out.push({lvl:q.late?'bad':'warn',kind:'quote',j,t:`Quote ${esc(nameOf(j))}`,s:q.late?`Due ${fmtShort(iso(q.due))}. ${-q.left} day${q.left===-1?'':'s'} late`:`Due ${q.left===0?'today':fmtD(iso(q.due))}`});
    if(p&&p.state==='soon')out.push({lvl:'warn',kind:'promise',j,t:`Book ${esc(nameOf(j))} in`,s:p.msg});
  }
  return out.sort((a,b)=>(a.lvl==='bad'?0:1)-(b.lvl==='bad'?0:1));
}
async function rescheduleJob(j,sd){
  const ts=tasksFor(j.id),crew=j.crew_size||S.settings.default_crew||2;
  const days=j.start_date&&j.end_date?Math.max(1,workDaysBetween(parse(j.start_date),parse(j.end_date)))
    :jobHours(ts)>0?jobDays(ts,crew):j.quoted_crew_days?Math.max(1,Math.ceil(j.quoted_crew_days/crew)):Math.max(1,Math.ceil(avgJobCrewDays()/crew));
  const start=nextWork(parse(sd)),patch={start_date:iso(start),end_date:iso(addWorkDays(start,days))};
  const lt=layoutTasks({start_date:patch.start_date,crew_size:j.crew_size},ts.map(t=>({...t})));
  const res=await Promise.all([sb.from('jobs').update(patch).eq('id',j.id),...lt.map(t=>sb.from('job_tasks').update({start_date:t.start_date,end_date:t.end_date}).eq('id',t.id))]);
  const err=res.find(r=>r.error);if(err)return toast(err.error.message);
  Object.assign(j,patch);toast(`${nameOf(j)} moved to ${fmtD(patch.start_date)}`);await loadAll();render();
}

/* ---------- auth ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY'){S.user=s?.user||null;return renderRecovery()}if(!!s!==!!S.user){S.user=s?.user||null;start()}});
  S.user=session?.user||null;start();
}
async function start(){
  if(!S.user)return renderLogin();
  const {data}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=data||{role:'pending',name:''};
  if(role()==='pending'){$('#root').innerHTML=`<div class="login"><div class="card"><h2>No access yet</h2><p class="small muted">${esc(S.user.email)} isn’t set up for the hub. Ask Kaitlin for your login.</p><button class="btn ghost block" id="lo">Log out</button></div></div>`;$('#lo').onclick=()=>sb.auth.signOut();return}
  S.view=isStaff()?'home':isMkt()?'board':'site';
  $('#root').innerHTML='<div class="spinner" style="margin-top:40vh"></div>';
  await loadAll();render();
}
function renderRecovery(){
  $('#root').innerHTML=`<div class="login"><div class="card">
    <div class="brandwrap" style="justify-content:center;margin-bottom:6px"><img src="${LOGO}" alt="Beck's Landscaping"><div class="brand" style="color:var(--green-2)"><b>BECK’S LANDSCAPING</b><span style="color:var(--mut)">HUB</span></div></div>
    <h2 style="margin:12px 0 4px">Set a new password</h2>
    <label for="rp1">New password</label><input id="rp1" type="password" autocomplete="new-password">
    <label for="rp2">Type it again</label><input id="rp2" type="password" autocomplete="new-password">
    <button class="btn block" id="rpgo" style="margin-top:12px">Save and go in</button><p class="small muted" id="rpmsg" style="margin:10px 0 0"></p></div></div>`;
  $('#rpgo').onclick=async()=>{const a=$('#rp1').value,b=$('#rp2').value;if(a.length<8)return $('#rpmsg').textContent='Use at least 8 characters';if(a!==b)return $('#rpmsg').textContent='They don’t match';
    $('#rpgo').disabled=true;const {error}=await sb.auth.updateUser({password:a});if(error){$('#rpgo').disabled=false;return $('#rpmsg').textContent=error.message}
    history.replaceState(null,'',location.pathname);start()}}
function renderLogin(){
  $('#root').innerHTML=`<div class="login"><div class="card">
    <div class="brandwrap" style="justify-content:center;margin-bottom:6px"><img src="${LOGO}" alt="Beck's Landscaping"><div class="brand" style="color:var(--green-2)"><b>BECK’S LANDSCAPING</b><span style="color:var(--mut)">HUB</span></div></div>
    <p class="small muted" style="margin:12px 0 4px">Jobs, board, numbers.</p>
    <form id="lf"><label for="em">Login</label><input id="em" autocomplete="username" autocapitalize="none" placeholder="Your name, or crew" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn block" style="margin-top:12px" id="go" type="submit">Log in</button></form>
    <p class="small muted" id="msg" style="margin:10px 0 0"></p>
    <button id="forgot" type="button" style="border:0;background:none;padding:0;margin-top:10px;font:inherit;font-size:13px;color:var(--green);text-decoration:underline;cursor:pointer">Forgotten your password?</button>
    <div id="fbox" class="hidden" style="margin-top:8px;padding-top:10px;border-top:1px solid var(--line)">
     <label for="fl">Your login</label><input id="fl" autocapitalize="none" placeholder="greg, crew, lauren">
     <button class="btn light block" id="fgo" type="button" style="margin-top:10px">Ask for a new password</button>
     <p class="tiny muted" style="margin:8px 0 0">Kaitlin gets told straight away and sets you a new one. If your login is your own email, a reset link comes to you too.</p></div></div></div>`;
  $('#forgot').onclick=()=>{$('#fbox').classList.toggle('hidden');$('#fl').value=$('#em').value;$('#fl').focus()};
  $('#fgo').onclick=async()=>{const login=$('#fl').value.trim().toLowerCase();if(!login)return;$('#fgo').disabled=true;
    const AKA={kaitlin:'kaitlin@vitalculture.com.au',lauren:'hattonlauren1995@gmail.com'};const email=AKA[login]||(login.includes('@')?login:null);
    await sb.rpc('request_password_reset',{p_login:login});
    if(email)await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/hub/'});
    $('#fbox').innerHTML=`<p class="small" style="margin:0"><b>Done.</b> ${email?'Check your email for a reset link. ':''}Kaitlin has been told and will text you a new password.</p>`};
  $('#lf').onsubmit=async e=>{e.preventDefault();let email=$('#em').value.trim().toLowerCase();const password=$('#pw').value;if(!email||!password)return;
    const AKA={kaitlin:'kaitlin@vitalculture.com.au',lauren:'hattonlauren1995@gmail.com'};if(AKA[email])email=AKA[email];else if(!email.includes('@'))email+='@beckslandscaping.com.au';$('#go').disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){$('#msg').textContent='That login or password didn’t work. Ask Kaitlin if you’re stuck.';$('#pw').value=''}
    $('#go').disabled=false};

function go(v,id){S.view=v;if(id!==undefined)S.jobId=id;render();scrollTo(0,0)}
function render(){
  // phone bar keeps five or six; items marked desk only show in the desktop sidebar (and on the Me page)
  const tabs=isStaff()?[['home','Today',IC.home],['jobs','Jobs',IC.jobs],['clients','Clients',IC.clients,'desk'],['board','Board',IC.board],['add','Log the day',IC.add],['tool','Toolbox',IC.tool],['nums','Numbers',IC.nums],['brain','Brain',IC.tool,'desk'],['activity','Activity',IC.nums,'desk'],['money','Money',IC.lock,'desk'],['mkt','Marketing',IC.mkt,'desk']]
    :isMkt()?[['board','Board',IC.board],['mkt','Marketing',IC.mkt]]:[['site','Jobs',IC.jobs],['board','Board',IC.board],['tool','Toolbox',IC.tool]];
  const allowed=new Set(tabs.map(t=>t[0]).concat(isStaff()?['job','review','dayrev','rates','me','cjob','quote','client','nq']:isMkt()?['me']:['me','cjob']));
  if(S.finUntil&&Date.now()>S.finUntil)S.finUntil=0;
  const v=allowed.has(S.view)?S.view:tabs[0][0];
  const cur=v==='job'||v==='review'||v==='quote'?'jobs':v==='client'?'clients':v==='nq'?'add':v==='dayrev'?'add':v==='cjob'?(isStaff()?'jobs':'site'):v;
  $('#root').innerHTML=`<div class="app"><header class="top"><div class="brandwrap"><img src="${LOGO}" alt=""><div class="brand"><b>BECK'S</b><span class="b2">LANDSCAPING</span><span>HUB</span></div></div><button class="who" id="me">${esc(S.profile.name||'Me')}</button></header><main id="main"></main></div>
  <nav class="tabs" aria-label="Main"><div class="brandwrap nav-brandwrap"><img src="${LOGO}" alt=""><div class="brand nav-brand"><b>BECK'S</b><span class="b2">LANDSCAPING</span><span>HUB</span></div></div>${tabs.map(([k,l,ic,d])=>`<button data-v="${k}" class="${k==='add'?'add':''} ${d||''} ${cur===k?'on':''}" aria-label="${l}">${ic}<span>${l}</span></button>`).join('')}<button class="nav-foot" id="me2">${esc(S.profile.name||'Me')} · ${esc(role())}</button></nav>`;
  document.querySelectorAll('nav.tabs button[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#me').onclick=()=>go('me');$('#me2').onclick=()=>go('me');
  const prevV=S.lastView;S.lastView=v;
  ({home:viewToday,money:viewMoney,jobs:viewJobs,board:viewBoard,add:viewAdd,review:viewReview,dayrev:viewDayReview,tool:viewToolbox,site:viewSite,cjob:viewCrewJob,job:viewJob,nums:viewNumbers,mkt:viewMarketing,rates:viewRates,me:viewMe,quote:viewQuote,clients:viewClients,client:viewClient,nq:viewNewQuote,brain:viewBrain,activity:viewActivity})[v]($('#main'));
  elevate(v,prevV,tabs.map(t=>t[0]));
}
function stageBar(stage){const i=STAGES.indexOf(stage);return `<div class="stagebar">${STAGES.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`}
function stagePill(s){const c=s==='Lost'?'bad':PENCIL.includes(s)?'warn':['Paid'].includes(s)?'grey':['Complete','Invoiced'].includes(s)?'good':'';return `<span class="pill ${c}">${esc(s)}</span>`}

function viewToday(el){
  const t0=today0(),now=new Date();
  const all=jobNumbers(),finished=all.filter(n=>n.actualDays>0);
  const lost=finished.reduce((a,n)=>a+n.lostDollars,0),lostDays=finished.reduce((a,n)=>a+n.lostDays,0);
  const perDay=finished.filter(n=>n.perDay);
  const avgPerDay=perDay.length?perDay.reduce((a,n)=>a+n.quoteEx,0)/perDay.reduce((a,n)=>a+n.actualDays,0):NaN;
  const withProfit=finished.filter(n=>n.profit!=null);
  const profit=withProfit.reduce((a,n)=>a+n.profit,0),rev=withProfit.reduce((a,n)=>a+n.revenueEx,0);
  const chase=S.jobs.filter(j=>['Complete','Invoiced'].includes(j.stage));
  const wks=weeksAhead(8),cap=wks.reduce((a,w)=>a+w.cap,0),bookedD=wks.reduce((a,w)=>a+w.booked,0),free=wks.reduce((a,w)=>a+w.free,0);
  const nfs=nextFreeStart();
  const unlogged=S.jobs.filter(j=>['Complete','Invoiced','Paid'].includes(j.stage)&&!daysFor(j.id).length);
  const noDates=S.jobs.filter(j=>BOOKED.includes(j.stage)&&!j.start_date&&!['late','soon'].includes(promiseOf(j)?.state));
  const quotesOut=S.jobs.filter(j=>j.stage==='Quoted'&&String(j.quote_date||'').slice(0,10)&&String(j.quote_date).slice(0,10)<=iso(addDays(t0,-7)));
  const noCost=S.crew.filter(c=>c.active!==false&&(c.cost_per_day==null||c.cost_per_day===''));
  const names=(js,n=3)=>js.slice(0,n).map(j=>esc(nameOf(j))).join(', ')+(js.length>n?` and ${js.length-n} more`:'');
  const plural=(n,a,b)=>n===1?a:b;

  const needs=timingAlerts().map(a=>[a.lvl,a.t,a.s,'job',a.kind==='quote'?'Quote':a.kind==='reply'?'Call':'Book',a.j.id]);
  const loggedToday=S.crewDays.some(d=>d.work_date===iso(t0)),onToday=S.jobs.some(j=>j.start_date&&j.end_date&&j.start_date<=iso(t0)&&j.end_date>=iso(t0)&&!['Lost','Paid'].includes(j.stage));
  if(isWork(t0)&&now.getHours()>=14&&!loggedToday&&onToday)needs.unshift(['warn',"Log today's crew",'Who was where, hours and any problems. Talk it in.','add','Log']);
  const fu=(S.cnotes||[]).filter(n=>n.follow_up_on&&!n.done_at&&n.follow_up_on<=iso(t0));
  for(const n of fu){const c=S.clients.find(x=>x.id===n.client_id);if(c)needs.push([n.follow_up_on<iso(t0)?'bad':'warn',`Follow up ${esc(c.name)}`,`${esc(n.note||n.kind||'')}${n.follow_up_on<iso(t0)?' · was due '+fmtShort(n.follow_up_on):''}`,'client','Open',c.id])}
  const openIss=(S.issues||[]).filter(i=>i.status==='open');
  if(openIss.length)needs.push(['info',`${openIss.length} ${plural(openIss.length,'problem','problems')} for Monday toolbox`,openIss.slice(0,2).map(i=>esc(i.note)).join(' · '),'tool','Toolbox']);
  if(noDates.length)needs.push(['bad',`${noDates.length} booked ${plural(noDates.length,'job has','jobs have')} no start date`,`Not on the board. ${names(noDates)}`,'board','Board']);
  const apprW=(S.camps||[]).filter(c=>c.status==='For approval');
  if(apprW.length)needs.push(['warn',`${apprW.length} marketing ${plural(apprW.length,'post','posts')} to approve`,`From Lauren. ${apprW.slice(0,2).map(c=>esc(c.title)).join(' · ')}`,'mkt','Approve']);
  const accOnline=S.jobs.filter(j=>j.quote_accepted_at&&j.stage==='Accepted');
  if(accOnline.length)needs.push(['info',`${accOnline.length} ${plural(accOnline.length,'quote','quotes')} accepted online`,`Deposit invoice drafts in Xero overnight. Book a start. ${names(accOnline)}`,'job','Open',accOnline[0].id]);
  const toOrder=S.jobs.filter(j=>['Accepted','Deposit in'].includes(j.stage)&&(S.qlines||[]).some(l=>l.job_id===j.id&&['Materials','Plant and hire'].includes(l.kind))&&!ordersFor(j.id).some(o=>o.status!=='Draft'));
  if(toOrder.length)needs.push(['warn',`Order materials for ${toOrder.length} ${plural(toOrder.length,'job','jobs')}`,names(toOrder),'job','Order',toOrder[0].id]);
  if(quotesOut.length)needs.push(['warn',`${quotesOut.length} ${plural(quotesOut.length,'quote','quotes')} out over a week`,`Follow up. ${names(quotesOut)}`,'jobs','Open']);
  if(chase.length)needs.push(['warn',`Chase ${chase.length} ${plural(chase.length,'invoice','invoices')}`,`Oldest first. ${names(chase)}`,'money','Money']);
  if(unlogged.length)needs.push(['warn',`${unlogged.length} finished ${plural(unlogged.length,'job has','jobs have')} no crew log`,'Profit and labour only count jobs with logged days','nums','Log']);
  if(noCost.length&&finished.length)needs.push(['info','Add what the crew cost a day',`Job profit needs it. ${noCost.map(c=>esc(c.name)).join(', ')}`,'rates','Rates']);
  if(cap&&free/cap>.4)needs.push(['info',`Board has room from ${fmtD(iso(nfs))}`,`${Math.round(free)} crew days free over 8 weeks. Push the $990 design.`,'mkt','Plan']);

  const promised=S.jobs.map(j=>({j,p:promiseOf(j)})).filter(x=>x.p&&x.p.state!=='done').sort((a,b)=>a.p.from-b.p.from);
  const stageRows=STAGES.concat(['Lost']).map(s=>({s,n:S.jobs.filter(j=>j.stage===s).length}));
  const maxN=Math.max(1,...stageRows.map(r=>r.n));
  const stageColour=s=>s==='Lost'?'var(--bad)':PENCIL.includes(s)?'var(--sand)':['Complete','Invoiced'].includes(s)?'var(--warn)':s==='Paid'?'var(--green-2)':'var(--green)';
  const live=S.jobs.filter(j=>j.start_date&&j.end_date&&!['Lost','Paid'].includes(j.stage));
  const hello=now.getHours()<12?'Good morning':now.getHours()<17?'Good afternoon':'Good evening';
  const firstName=(S.profile.name||'').split(' ')[0];
  const logged=`Based on ${finished.length} ${plural(finished.length,'job','jobs')} with a crew log`;
  const pState={late:['bad','Missed'],soon:['warn','Book in'],booked:['good','Booked'],ok:['grey','Waiting']};

  el.innerHTML=`<div class="today-head"><div><div class="eyebrow">${t0.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div>
   <h1>${hello}${firstName?', '+esc(firstName):''}</h1></div><div class="row" style="gap:8px"><button class="btn light sm" data-go="clients">Clients</button><button class="btn sm" data-go="nq">+ New quote</button></div></div>
  ${S.dbReady?'':`<div class="need info" style="cursor:default;margin-top:12px"><span class="dot"></span><span class="txt"><b>Database update waiting</b><span>Enquiries and promised start windows switch on once it has run.</span></span></div>`}
  ${tellCard()}
  <div class="tiles">
   <div class="tile dark"><div class="eyebrow">Job profit</div><div class="v">${withProfit.length?money(profit):'–'}</div>
    <div class="s">${withProfit.length?`${pct(profit/rev)} margin on ${withProfit.length} ${plural(withProfit.length,'job','jobs')}`:'Needs crew cost per day in Rates'}</div>
    <div class="src">Quote ex GST, less materials and crew cost</div></div>
   <div class="tile"><div class="eyebrow">Labour given away</div><div class="v ${lost>0?'bad':''}">${money(lost)}</div>
    <div class="s">${r1(lostDays)} crew days past quote</div><div class="src">${logged}</div></div>
   <div class="tile"><div class="eyebrow">Earned per crew day</div><div class="v">${isFinite(avgPerDay)?money(avgPerDay):'–'}</div>
    <div class="s">Charged at ${money(DAY_RATE())} a crew day</div><div class="src">${logged}</div></div>
   <div class="tile"><div class="eyebrow">Crew days free</div><div class="v">${Math.round(free)}</div>
    <div class="s">Next 8 weeks${isFinite(free/avgJobCrewDays())?` · about ${Math.max(0,Math.floor(free/avgJobCrewDays()))} jobs of room`:''}</div>
    <div class="meter" role="img" aria-label="${r1(bookedD)} of ${cap} crew days booked"><i style="width:${cap?Math.min(100,bookedD/cap*100):0}%"></i></div>
    <div class="src">${r1(bookedD)} of ${cap} booked · from the board</div></div>
  </div>
  <div class="today-grid">
   <div class="card"><div class="row between"><h2>Needs you</h2><span class="small muted">${needs.length}</span></div>
    ${needs.length?needs.map(([k,t,s,v,b,id])=>`<button class="need ${k==='warn'?'':k}" data-go="${v}"${id?` data-id="${id}"`:''}><span class="dot"></span><span class="txt"><b>${t}</b><span>${s}</span></span><span class="go">${b}</span></button>`).join(''):'<p class="small muted" style="margin:10px 0 0">Nothing needs you today.</p>'}</div>
   ${toCheckCard()}

const ACT={deposit_invoice:'Deposit invoice drafted',deposit_paid:'Deposit paid, job booked',final_invoice:'Final invoice drafted',final_paid:'Paid in full',review_draft:'Review email drafted for approval',reset_request:'Asked for a new password',note:'Note'};
function toCheckCard(){
  const log=S.alog||[];if(!log.length)return '';
  const open=log.filter(l=>l.needs_check&&!l.checked_at),done=log.filter(l=>!(l.needs_check&&!l.checked_at)).slice(0,5);
  const row=l=>{const j=S.jobs.find(x=>x.id===l.job_id);return `<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line);gap:8px"><div class="small" style="min-width:0"><b>${esc(ACT[l.action]||l.action)}${j?` · ${esc(nameOf(j))}`:''}</b><div class="tiny muted">${fmtShort(String(l.created_at).slice(0,10))}${l.amount!=null?` · ${money(l.amount)} ex GST`:''}${l.ref?` · ${esc(l.ref)}`:''}${l.detail?` · ${esc(l.detail)}`:''}</div></div>${l.checked_at?'<span class="pill good">Checked</span>':l.action==='reset_request'?`<button class="btn sm" data-go="me">Reset</button>`:`<button class="btn light sm" data-chk="${l.id}">Checked</button>`}</div>`};

/* ---------- Tell the hub: Greg talks, the hub proposes actions, Greg taps Apply ---------- */
function tellCard(){return `<div class="card" id="tell"><div class="row between"><h2>Tell the hub</h2><span class="tiny muted">Talk it in</span></div>
   <textarea id="tellt" style="min-height:56px;margin-top:8px" placeholder="New client Jenny Smith in Floreat, 0412 000 000, wants paving. Call her Thursday. Pearse job starts Monday with two crew."></textarea>
   <div class="row between" style="margin-top:8px"><span class="tiny muted">Adds clients, notes, follow ups, start dates, stage changes and things to watch. New jobs go through New quote.</span><button class="btn sm" id="tellgo">Work it out</button></div>
   <div id="tellout"></div></div>`}
async function fnErr(data,error){let msg=data?.error;if(error&&!msg){try{msg=(await error.context.json()).error}catch{msg=error.message}}
  if(msg&&/credit balance/i.test(msg))msg='The hub\u2019s Claude account is out of credit. Top it up at console.anthropic.com (Plans and Billing) and this works again.';
  if(msg&&/api key/i.test(msg)&&/not set/i.test(msg))msg='The Claude API key is missing in Supabase secrets.';
  return msg||null}
function bindTell(el){const go1=$('#tellgo');if(!go1)return;
  go1.onclick=async()=>{const t=$('#tellt').value.trim();if(!t)return toast('Say or type something first');go1.disabled=true;go1.textContent='Reading…';
    const {data,error}=await sb.functions.invoke('parse-command',{body:{transcript:t}});go1.disabled=false;go1.textContent='Work it out';
    const emsg=await fnErr(data,error);if(emsg)return toast(emsg);
    const r=data.result||{actions:[],questions:[]};S.tell=r;
    $('#tellout').innerHTML=`<div style="margin-top:10px">${r.actions.length?r.actions.map((a,i)=>`<label class="row" style="gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start"><input type="checkbox" data-ai="${i}" checked style="width:auto;margin-top:3px"><span class="small">${esc(a.summary)}</span></label>`).join(''):'<p class="small muted">Nothing to apply.</p>'}
     ${(r.questions||[]).length?`<div class="small" style="margin-top:8px"><b>To clear up</b>${r.questions.map(q=>`<div class="muted">${esc(q)}</div>`).join('')}</div>`:''}
     ${r.actions.length?`<div class="row" style="gap:8px;margin-top:10px"><button class="btn sm" id="tellapply">Apply ${r.actions.length===1?'it':'these'}</button><button class="btn light sm" id="tellclear">Clear</button></div>`:''}</div>`;
    $('#tellclear')&&($('#tellclear').onclick=()=>{$('#tellout').innerHTML='';S.tell=null});
    $('#tellapply')&&($('#tellapply').onclick=async()=>{const picks=[...el.querySelectorAll('[data-ai]:checked')].map(c=>r.actions[+c.dataset.ai]);$('#tellapply').disabled=true;
      let done=0,fail=[];for(const a of picks){try{await applyAction(a);done++}catch(e){fail.push(`${a.summary}: ${e.message||e}`)}}
      await loadAll();toast(fail.length?`${done} applied, ${fail.length} failed`:`${done} applied`);if(fail.length)console.warn(fail);S.tell=null;render();if(fail.length)alert(fail.join('\n'))})}}
async function applyAction(a){
  const nowIso=new Date().toISOString(),who={by:S.profile.id,by_name:S.profile.name||null};
  const must=async p=>{const r=await p;if(r.error)throw new Error(r.error.message);return r.data};
  const clientFor=async()=>{if(a.client_id)return a.client_id;if(a.job_id){const j=S.jobs.find(x=>x.id===a.job_id);if(j?.client_id)return j.client_id}
    if(a.name){const ex=S.clients.find(c=>c.name.toLowerCase()===a.name.toLowerCase());if(ex)return ex.id;const c=await must(sb.from('clients').insert({name:a.name,phone:a.phone||null,email:a.email||null,address:a.address||null,suburb:a.suburb||null,source:a.source||null}).select().single());S.clients.push(c);return c.id}
    throw new Error('No client named')};
  const jobFor=()=>{if(a.job_id)return a.job_id;const cid=a.client_id;const j=cid?clientJobs(cid).find(x=>!['Paid','Lost'].includes(x.stage)):null;if(j)return j.id;throw new Error('No job named')};
  switch(a.type){
    case 'add_client':{const cid=await clientFor();if(a.note)await must(sb.from('client_notes').insert({client_id:cid,kind:'Note',note:a.note,...who}));return}
    case 'update_client':{const cid=await clientFor();const u={};for(const k of ['phone','email','address','suburb','source'])if(a[k])u[k]=a[k];if(Object.keys(u).length)await must(sb.from('clients').update(u).eq('id',cid));if(a.note)await must(sb.from('client_notes').insert({client_id:cid,kind:'Note',note:a.note,...who}));return}
    case 'add_note':{const cid=await clientFor();await must(sb.from('client_notes').insert({client_id:cid,job_id:a.job_id||null,kind:a.kind||'Note',note:a.note||a.summary,follow_up_on:a.follow_up_on||null,...who}));return}
    case 'follow_up':{const cid=await clientFor();if(!a.follow_up_on)throw new Error('No date');await must(sb.from('client_notes').insert({client_id:cid,job_id:a.job_id||null,kind:a.kind||'Note',note:a.note||a.summary,follow_up_on:a.follow_up_on,...who}));return}
    case 'move_stage':{const jid=jobFor();if(!a.stage)throw new Error('No stage');await must(sb.from('jobs').update({stage:a.stage}).eq('id',jid));await sb.from('checkpoints').insert({job_id:jid,stage:a.stage,note:'Told the hub'});return}
    case 'set_start':{const jid=jobFor();if(!a.start_date)throw new Error('No date');const j=S.jobs.find(x=>x.id===jid);const crew=a.crew_size||j?.crew_size||S.settings.default_crew||2;const days=j?Math.max(1,Math.round(+j.quoted_crew_days||+j.est_days||1)):1;
      const u={start_date:a.start_date,end_date:iso(addWorkDays(parse(a.start_date),days)),crew_size:crew};if(j&&['Lead','Design','Quoted'].includes(j.stage))u.stage='Accepted';await must(sb.from('jobs').update(u).eq('id',jid));return}
    case 'mark_lost':{const jid=jobFor();await must(sb.from('jobs').update({stage:'Lost',lost_reason:a.reason||null,closed_at:nowIso}).eq('id',jid));return}
    case 'watch':{await must(sb.from('brain').insert({kind:a.kind&&BRAIN_KINDS.includes(a.kind)?a.kind:'Other',note:a.note||a.summary,job_id:a.job_id||null,watch:true,...who}));return}
    default:throw new Error('Unknown action '+a.type)}
}

function whenStr(ts){const d=new Date(ts);return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase()}
function fmtVal(k,v){if(v===''||v==null)return '–';if(/_at$|_on$|date$|^week_start$/.test(k)&&/^\d{4}-\d\d-\d\d/.test(v))return fmtShort(v.slice(0,10));if(['quote_total','quote_ex_gst','quoted_labour','unit_cost'].includes(k)&&!isNaN(+v))return money(+v);return v.length>60?v.slice(0,60)+'…':v}
function histLine(a){const ch=a.changed||{},keys=Object.keys(ch).filter(k=>FIELD[k]||a.action!=='insert').slice(0,4);
  const what=a.action==='insert'?`Added ${(TBL[a.table_name]||a.table_name).toLowerCase()}${a.label?': '+esc(a.label.slice(0,60)):''}`:a.action==='delete'?`Removed ${(TBL[a.table_name]||a.table_name).toLowerCase()}${a.label?': '+esc(a.label.slice(0,60)):''}`:

function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}

function elevate(v,prevV,tabKeys){

      ph.addEventListener('touchend',e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(Math.abs(dy)<40)return;const slim=dy<0;ph.classList.toggle('slim',slim);lsSet('hero-slim',slim)},{passive:true})}}

    if(!body.childNodes.length)return;card.appendChild(body);
    let head=first;if(first.tagName==='H2'){head=document.createElement('div');head.className='row between';card.insertBefore(head,first);head.appendChild(first)}
    head.classList.add('fold-head');head.style.display='flex';head.style.alignItems='center';card.classList.add('foldable');if(folded[key])card.classList.add('folded');
    head.addEventListener('click',e=>{if(e.target.closest('button,a,select,input,label'))return;card.classList.toggle('folded');const f=lsGet('folds',{});f[key]=card.classList.contains('folded');lsSet('folds',f)});
    let y0=null;head.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
    head.addEventListener('touchend',e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(Math.abs(dy)>36){const shut=dy<0;card.classList.toggle('folded',shut);const f=lsGet('folds',{});f[key]=shut;lsSet('folds',f)}},{passive:true})});

(function(){let x0=null,y0=null,t0=0,ok=false;

  const scrollsX=el=>{for(let n=el;n&&n.id!=='main';n=n.parentElement){if(n.scrollWidth>n.clientWidth+4&&getComputedStyle(n).overflowX!=='visible')return true}return false};
  document.addEventListener('touchstart',e=>{const t=e.target;if(!t.closest||!t.closest('#main')||noSwipe(t)||scrollsX(t)){ok=false;return}ok=true;x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});
  document.addEventListener('touchend',e=>{if(!ok||x0==null)return;ok=false;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0,dt=Date.now()-t0;x0=null;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6||dt>700||window.innerWidth>=1000)return;
    const v=S.lastView,tabs=[...document.querySelectorAll('nav.tabs button[data-v]')].filter(b=>getComputedStyle(b).display!=='none').map(b=>b.dataset.v).filter(k=>k!=='add');
    const back={job:'jobs',quote:'job',review:'add',client:'clients',dayrev:'add',cjob:isStaff()?'jobs':'site',nq:'home'};
    if(back[v]){if(dx>0){const to=back[v];to==='job'&&S.jobId?go('job',S.jobId):go(to)}return}
    const i=tabs.indexOf(v);if(i<0)return;const n=dx<0?tabs[i+1]:tabs[i-1];if(n)go(n)},{passive:true})})();

  </div></div>
  <div class="legend"><span><b style="background:repeating-linear-gradient(45deg,#c9a96e 0 4px,#d6bb87 4px 8px)"></b>Lead, design or quote (pencilled)</span><span><b style="background:var(--green)"></b>Booked</span><span><b style="background:var(--green-2)"></b>On site</span><span><b style="background:#8d9a97"></b>Finished</span><span><b style="background:rgba(201,169,110,.18);border:1.5px dashed var(--sand)"></b>Promised start window</span><span><b style="background:var(--bad);width:2px"></b>Today</span></div>`:`<div class="empty">Nothing booked yet.</div>`}

function bindDrag(el,W){
  el.querySelectorAll('.g-bar[data-id]:not([data-drag])').forEach(b=>b.onclick=()=>isStaff()?go('job',b.dataset.id):!isMkt()&&go('cjob',b.dataset.id));
  el.querySelectorAll('[data-drag]').forEach(bar=>{
    let x0=null,left0=0,moved=0;
    bar.addEventListener('pointerdown',e=>{if(e.button>0)return;x0=e.clientX;left0=parseFloat(bar.style.left);moved=0;bar.setPointerCapture(e.pointerId);bar.classList.add('lift')});
    bar.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;if(Math.abs(dx)>5)moved=1;if(!moved)return;
      const k=Math.round(dx/W);bar.style.left=(left0+k*W)+'px';const d=addDays(parse(bar.dataset.base),k);$('#tip').textContent=(k?'Start '+fmtD(iso(nextWork(d))):'Drop to keep');$('#tip').style.opacity=1;$('#tip').style.left=Math.min(innerWidth-250,e.clientX+12)+'px';$('#tip').style.top=(e.clientY-36)+'px'});
    const end=async e=>{if(x0==null)return;const dx=e.clientX-x0,k=Math.round(dx/W);x0=null;bar.classList.remove('lift');$('#tip').style.opacity=0;
      const j=S.jobs.find(x=>x.id===bar.dataset.drag);if(!j)return;
      if(!moved)return go('job',j.id);
      if(!k&&j.start_date){bar.style.left=left0+'px';return}
      await rescheduleJob(j,iso(addDays(parse(bar.dataset.base),k)))};
    bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',()=>{if(x0==null)return;x0=null;bar.style.left=left0+'px';bar.classList.remove('lift');$('#tip').style.opacity=0});
  });
}
function weekList(jobs,from){const end=new Date(from);end.setDate(end.getDate()+6);const items=[];
  for(const j of jobs)for(const t of tasksFor(j.id)){if(!t.start_date)continue;const s=parse(t.start_date),e=parse(t.end_date||t.start_date);if(e<from||s>end)continue;items.push({j,t,s})}
  items.sort((a,b)=>a.s-b.s);
  return items.length?`<table style="margin-top:6px">${items.map(({j,t})=>`<tr><td class="small" style="width:84px">${fmtD(t.start_date)}</td><td><b class="small">${esc(t.task_type)}</b><div class="tiny muted">${esc(j.clients?.name||'')} · ${esc(j.suburb||'')}</div></td><td class="num small">${r1(t.est_hours)}h</td></tr>`).join('')}</table>`:`<p class="small muted">Nothing on this week.</p>`}
function bindTips(el){const tip=$('#tip');el.querySelectorAll('[data-tip]').forEach(n=>{
  n.addEventListener('pointerenter',e=>{tip.textContent=n.dataset.tip;tip.style.opacity=1});
  n.addEventListener('pointermove',e=>{tip.style.left=Math.min(innerWidth-250,e.clientX+12)+'px';tip.style.top=(e.clientY-36)+'px'});
  n.addEventListener('pointerleave',()=>tip.style.opacity=0)})}

function viewNumbers(el){
  const all=jobNumbers();
  const finished=all.filter(n=>n.actualDays>0);
  const lost=finished.reduce((a,n)=>a+n.lostDollars,0),lostDays=finished.reduce((a,n)=>a+n.lostDays,0);
  const qd=finished.reduce((a,n)=>a+(n.qDays||0),0),ad=finished.reduce((a,n)=>a+n.actualDays-n.varDays,0);
  const decided=S.jobs.filter(j=>!['Lead','Design','Quoted'].includes(j.stage));const won=decided.filter(j=>j.stage!=='Lost');
  const winRate=decided.length?won.length/decided.length:NaN;
  const perDay=finished.filter(n=>n.perDay);const avgPerDay=perDay.length?perDay.reduce((a,n)=>a+n.quoteEx,0)/perDay.reduce((a,n)=>a+n.actualDays,0):NaN;
  const owed=S.jobs.filter(j=>['Complete','Invoiced'].includes(j.stage)).reduce((a,j)=>a+(+j.invoiced_total||+j.quote_total||0),0);
  const pipeline=S.jobs.filter(j=>['Lead','Design','Quoted'].includes(j.stage)).reduce((a,j)=>a+(+j.quote_total||0),0);
  const booked=S.jobs.filter(j=>BOOKED.includes(j.stage)).reduce((a,j)=>a+(+j.quote_total||0),0);
  const unlogged=S.jobs.filter(j=>['Complete','Invoiced','Paid'].includes(j.stage)&&!daysFor(j.id).length);
  const wp=finished.filter(n=>n.profit!=null),profitT=wp.reduce((a,n)=>a+n.profit,0),revT=wp.reduce((a,n)=>a+n.revenueEx,0);
  el.innerHTML=`<div class="row between" style="margin:18px 0 6px"><h1>Numbers</h1><button class="btn light sm" id="toMoney">${IC.lock.replace('<svg','<svg width="14" height="14" style="vertical-align:-2px;margin-right:4px"')}Money</button></div>
  <div class="hero"><div class="eyebrow">Labour given away</div><div class="big">${money(lost)}</div>
   <p>${r1(lostDays)} crew days worked past the quote on finished jobs, not counting variations, at ${money(DAY_RATE())} a crew day.${qd?` Jobs ran ${pct(ad/qd-1)} over the quoted days.`:''}</p></div>
  <div class="kpis">
   <div class="kpi"><div class="eyebrow">Earned per crew day</div><div class="v">${isFinite(avgPerDay)?money(avgPerDay):'–'}</div><div class="s">Quote ex GST divided by crew days actually worked</div></div>
   <div class="kpi"><div class="eyebrow">Quote win rate</div><div class="v">${pct(winRate)}</div><div class="s">${won.length} won of ${decided.length} decided${decided.length<5?'. Needs more jobs to mean much':''}</div></div>
   <div class="kpi"><div class="eyebrow">Job profit</div><div class="v">${wp.length?money(profitT):'–'}</div><div class="s">${wp.length?`${pct(profitT/revT)} margin on ${wp.length} job${wp.length>1?'s':''}`:'Add crew cost per day in Rates to see this'}</div></div>
  </div>
  <div class="card"><div class="row between"><h2>Won work by month</h2><span class="tiny muted">Quote ex GST, last 6 months</span></div>
   <p class="small muted" style="margin:4px 0 0">Light is everything quoted that month, dark is what went ahead. From each job's quote date, or when it came in.</p>
   ${monthChart()}</div>
  <div class="card"><div class="row between"><h2>Profit by job</h2><span class="tiny muted">Finished jobs with a crew log</span></div>
   <p class="small muted" style="margin:4px 0 0">Quote ex GST less materials and logged crew cost. Red is a job that lost money.</p>
   ${wp.length?profitChart(wp):'<p class="small muted">Needs crew cost per day in Rates and a logged job.</p>'}</div>
  <div class="card"><div class="row between"><h2>Quoted vs worked, crew days</h2></div>
   <p class="small muted" style="margin:4px 0 0">Each finished job. The gap is time Greg didn't charge for.</p>
   ${finished.length?daysChart(finished):'<p class="small muted">Log crew days on a finished job to see this.</p>'}</div>
  <div class="card"><h2>Job by job</h2><table style="margin-top:8px"><thead><tr><th>Job</th><th class="num">Quoted</th><th class="num">Worked</th><th class="num">Variation</th><th class="num">Over</th><th class="num">Profit</th></tr></thead><tbody>
   ${finished.map(n=>`<tr data-id="${n.j.id}" style="cursor:pointer"><td><b class="small">${esc(n.j.clients?.name||'')}</b><div class="tiny muted">${esc(n.j.suburb||'')}</div></td><td class="num">${r1(n.qDays)}d</td><td class="num">${r1(n.actualDays)}d</td><td class="num">${r1(n.varDays)}d</td><td class="num" style="color:${n.lostDollars>0?'var(--bad)':'var(--good)'};font-weight:600">${money(n.lostDollars)}</td><td class="num" style="font-weight:600;color:${n.profit==null?'var(--mut)':n.profit<0?'var(--bad)':'var(--good)'}">${n.profit==null?'–':money(n.profit)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted small">No crew logs yet</td></tr>'}
  </tbody></table>
  ${unlogged.length?`<p class="small" style="margin:10px 0 0"><span class="pill warn">${unlogged.length} finished job${unlogged.length>1?'s':''} with no crew log</span> ${unlogged.map(j=>esc(j.clients?.name)).join(', ')}. Log who worked which day so these count.</p>`:''}</div>
  <div class="card small muted">How job profit is worked out: the invoice or quote ex GST, less materials (supplier costs when logged, otherwise the materials in the quote), less each logged crew day at that person's cost per day.<br><br>How lost labour is worked out: crew days logged minus variation days minus quoted crew days, times ${money(DAY_RATE())}. Quoted crew days come from the labour figure on the quote divided by ${money(DAY_RATE())}. <a href="#" id="toRates" style="color:var(--green-2)">Rates and day rate</a></div>`;
  el.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>go('job',r.dataset.id));
  $('#toRates').onclick=e=>{e.preventDefault();go('rates')};$('#toMoney').onclick=()=>go('money');

}
function monthChart(){
  const t0=today0(),months=[];for(let i=5;i>=0;i--){const d=new Date(t0.getFullYear(),t0.getMonth()-i,1);months.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,l:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()],q:0,w:0,n:0,nw:0})}
  for(const j of S.jobs){const d=String(j.quote_date||j.created_at||'').slice(0,7);const m=months.find(x=>x.k===d);if(!m)continue;const v=(+j.quote_total||0)/1.1;if(!v)continue;m.q+=v;m.n++;if(!['Lead','Design','Quoted','Lost'].includes(j.stage)){m.w+=v;m.nw++}}
  const w=360,h=170,padL=44,padB=26,top=14,max=Math.max(1,...months.map(m=>m.q))*1.08,bw=(w-padL-10)/months.length,y=v=>top+(h-padB-top)*(1-v/max);
  const ticks=[0,.5,1].map(f=>max*f);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Quoted and won work by month">
   ${ticks.map(v=>`<line x1="${padL}" x2="${w-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eeebe3"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?'$'+Math.round(v/1000)+'k':'$'+Math.round(v)}</text>`).join('')}
   ${months.map((m,i)=>{const x=padL+i*bw+bw*.15,b=bw*.7;return `<rect x="${x}" y="${y(m.q)}" width="${b}" height="${y(0)-y(m.q)}" rx="4" fill="#a9bcbe" data-tip="${m.l}: ${money(m.q)} quoted across ${m.n} job${m.n===1?'':'s'}"/><rect x="${x}" y="${y(m.w)}" width="${b}" height="${y(0)-y(m.w)}" rx="4" fill="#2c3d40" data-tip="${m.l}: ${money(m.w)} won, ${m.nw} job${m.nw===1?'':'s'}"/><text x="${x+b/2}" y="${h-8}" text-anchor="middle" class="lbl">${m.l}</text>`}).join('')}</svg>`}
function profitChart(list){
  const rows=list.slice().sort((a,b)=>b.profit-a.profit).slice(0,10),rowH=28,padL=110,padR=60,w=360,h=rows.length*rowH+10;
  const max=Math.max(1,...rows.map(n=>Math.abs(n.profit)));const zero=padL+(w-padL-padR)*(rows.some(n=>n.profit<0)?.35:0);const sc=(w-padL-padR-(zero-padL))/max;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Profit by job">
   <line x1="${zero}" x2="${zero}" y1="0" y2="${h}" stroke="#c9d3d2"/>
   ${rows.map((n,i)=>{const yy=i*rowH+6,v=n.profit,neg=v<0,len=Math.max(3,Math.abs(v)*(neg?(zero-padL)/max:sc));return `<text x="0" y="${yy+13}" class="lbl">${esc((n.j.clients?.name||n.j.suburb||'').slice(0,16))}</text>
    <rect x="${neg?zero-len:zero}" y="${yy}" width="${len}" height="18" rx="4" fill="${neg?'var(--bad)':'#3d5457'}" data-tip="${esc(n.j.clients?.name||'')}: ${money(v)} profit on ${money(n.revenueEx)} ex GST"/>
    <text x="${neg?zero-len-4:zero+len+4}" y="${yy+13}" text-anchor="${neg?'end':'start'}">${money(v)}</text>`}).join('')}</svg>`}
function daysChart(list){
  const rowH=52,padL=100,padR=34,w=360,h=list.length*rowH+34;const max=Math.max(...list.map(n=>Math.max(n.qDays||0,n.actualDays)))*1.1||1;
  const x=v=>padL+(w-padL-padR)*v/max;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Quoted versus worked crew days per job">
   ${list.map((n,i)=>{const y=i*rowH+8,base=n.actualDays-n.varDays;return `
    <text x="0" y="${y+14}" class="lbl">${esc((n.j.clients?.name||'').slice(0,15))}</text><text x="0" y="${y+30}">${esc(n.j.suburb||'')}</text>
    <rect x="${padL}" y="${y}" width="${Math.max(4,x(n.qDays||0)-padL)}" height="14" rx="4" fill="#a9bcbe" data-tip="Quoted: ${r1(n.qDays)} crew days"/>
    <rect x="${padL}" y="${y+18}" width="${Math.max(4,x(base)-padL)}" height="14" rx="4" fill="#2c3d40" data-tip="Worked on quoted scope: ${r1(base)} crew days"/>

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;let dict=null;
function dictate(field,btn){
  if(!SRC){field.focus();return toast('Use the mic on your keyboard')}
  if(dict){const was=dict.btn;dict.r.stop();if(was===btn)return}
  const r=new SRC();r.lang='en-AU';r.continuous=true;r.interimResults=true;
  const base=field.value?field.value.replace(/\s*$/,' '):'';let fin='';
  r.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript+' ';else interim+=x[0].transcript}
    field.value=base+fin+interim;field.dispatchEvent(new Event('input',{bubbles:true}))};
  r.onend=()=>{btn.classList.remove('live');field.value=(base+fin).trim()||field.value;field.dispatchEvent(new Event('input',{bubbles:true}));field.dispatchEvent(new Event('change',{bubbles:true}));if(dict&&dict.r===r)dict=null};
  r.onerror=ev=>toast(ev.error==='not-allowed'?'Allow the microphone in settings':'Mic stopped');
  r.start();btn.classList.add('live');dict={r,btn};
}
function addMics(root){
  root.querySelectorAll('textarea:not([data-nomic]):not(.has-mic),input[data-mic]:not(.has-mic)').forEach(f=>{
    if(f.id==='tx')return;
    f.classList.add('has-mic');const w=document.createElement('span');w.className='micwrap';f.parentNode.insertBefore(w,f);w.appendChild(f);
    const b=document.createElement('button');b.type='button';b.className='minimic';b.setAttribute('aria-label','Talk instead of typing');b.innerHTML=IC.mic;
    b.onclick=()=>dictate(f,b);w.appendChild(b)});
}
new MutationObserver(()=>{const m=$('#main');if(m)addMics(m)}).observe(document.getElementById('root'),{childList:true,subtree:true});

    rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;const base=S.draft.transcript?S.draft.transcript.trim()+' ':'';let fin='';
    rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else interim+=r[0].transcript}$('#tx').value=base+fin+interim;S.draft.transcript=base+fin};

function shrink(file,max=1800){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};img.src=URL.createObjectURL(file)})}
