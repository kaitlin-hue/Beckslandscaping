<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2c3d40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beck's Hub">
<title>Beck's Hub</title>
<style>
:root{
  --ink:#15140f;--charcoal:#2b2f2a;--green:#3d5457;--green-2:#2c3d40;--green-l:#a9bcbe;--green-xl:#e3eaeb;
  --paper:#f7f5ef;--card:#fff;--line:#e2dcc9;--mut:#8a8577;--sand:#c9a96e;
  --good:#3f7a4f;--warn:#b7791f;--bad:#b4432f;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:24px;font-weight:700}h2{font-size:17px;font-weight:700}h3{font-size:15px;font-weight:600}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:820px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--green-2);color:#fff;margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-weight:800;letter-spacing:.04em;font-size:15px}.brand span{font-size:10px;letter-spacing:.24em;color:var(--green-l);margin-top:3px}
.who{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:40px;padding:7px 12px;font-size:13px;cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--mut)}.small{font-size:13px}.tiny{font-size:11px}
.btn{border:0;border-radius:40px;padding:12px 18px;font-weight:600;background:var(--green);color:#fff;cursor:pointer;font-size:14px}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--green-2);border:1.5px solid var(--green)}
.btn.light{background:var(--green-xl);color:var(--green-2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-l);border-color:var(--green)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--green-xl);color:var(--green-2);white-space:nowrap}
.pill.warn{background:#f6ead2;color:#7d5410}.pill.bad{background:#f5ddd7;color:var(--bad)}.pill.good{background:#dfeedd;color:var(--good)}.pill.grey{background:#eeebe3;color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 8px;cursor:pointer;min-width:58px}
nav.tabs button.on{color:var(--green-2);font-weight:700}
nav.tabs svg{width:22px;height:22px}
nav.tabs .add{background:var(--green);color:#fff;border-radius:50%;width:56px;height:56px;min-width:56px;margin-top:-24px;box-shadow:0 6px 16px rgba(44,61,64,.35);justify-content:center}
nav.tabs .add span{display:none}
.job{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.stagebar{display:flex;gap:3px;margin:10px 0 2px}.stagebar i{flex:1;height:5px;border-radius:3px;background:#ebe7dc}.stagebar i.on{background:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:Georgia,serif;font-size:28px;line-height:1.1;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.35}
.kpi.alert{border-color:#e9c7bf;background:#fdf6f4}.kpi.alert .v{color:var(--bad)}
.hero{background:var(--green-2);color:#fff;border-radius:16px;padding:20px;margin:12px 0;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--green-l)}
.hero .big{font-family:Georgia,serif;font-size:40px;line-height:1.05;margin:6px 0}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(169,188,190,.25),transparent 70%)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid #f1ede3;vertical-align:top}
td input{padding:6px 8px;font-size:13px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cp{display:flex;gap:12px;align-items:flex-start;position:relative;padding:5px 0}
.cp .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;z-index:1}
.cp.done .dot{background:var(--green);border-color:var(--green)}.cp.next .dot{border-color:var(--green)}
.cp:not(:last-child)::after{content:"";position:absolute;left:10px;top:27px;bottom:-5px;width:2px;background:var(--line)}
.cp.done:not(:last-child)::after{background:var(--green)}
.gantt{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
.g-hdr{display:flex;position:sticky;top:0;background:#faf8f2;border-bottom:1px solid var(--line)}
.g-day{flex:none;text-align:center;font-size:10px;color:var(--mut);border-left:1px solid #f1ede3;padding:4px 0;line-height:1.25}
.g-day.we{background:#f3f0e8}.g-day.today{color:var(--bad);font-weight:700}
.g-row{display:flex}
.g-lab{position:sticky;left:0;z-index:2;background:#fff;width:128px;flex:none;padding:6px 8px;font-size:12px;font-weight:600;border-right:1px solid var(--line);height:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.g-lab small{display:block;font-weight:400;color:var(--mut)}
.g-lane{position:relative;height:46px;border-bottom:1px solid #f1ede3;flex:none}
.g-bar{position:absolute;top:10px;height:26px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.g-bar.pencil{background:repeating-linear-gradient(45deg,#c9a96e 0 6px,#d6bb87 6px 12px);color:#3b2d12}
.g-bar.booked{background:var(--green)}.g-bar.onsite{background:var(--green-2)}.g-bar.done{background:#8d9a97}
.g-cap{height:34px}
.g-cap i{position:absolute;bottom:4px;width:calc(100% - 4px);border-radius:3px 3px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.wk{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:#fff}
.wk .bar{height:46px;background:#efece4;border-radius:6px;position:relative;overflow:hidden;margin:6px 0}
.wk .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--green)}
.wk .bar i.over{background:var(--bad)}
.wk b{display:block;font-size:12px}.wk span{font-size:10px;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--mut)}
.chart .lbl{fill:var(--ink);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:30;opacity:0;transition:opacity .12s;max-width:240px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.spinner{width:28px;height:28px;border:3px solid var(--green-xl);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.recorder{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 16px}
.bigmic{width:92px;height:92px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(44,61,64,.3)}
.bigmic.live{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,67,47,.5)}100%{box-shadow:0 0 0 22px rgba(180,67,47,0)}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.q{background:#f6ead2;border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:40px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.seg{display:flex;background:#eeebe3;border-radius:40px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:40px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.camp{border-left:3px solid var(--green);padding:8px 0 8px 12px;margin:8px 0}
.camp.push{border-color:var(--sand)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,rgba(44,61,64,.82),rgba(21,20,15,.92)),url('https://nwpperddaojaafsyuqyx.supabase.co/storage/v1/object/public/site/burwood/render.webp') center/cover}
.login .card{max-width:380px;width:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://nwpperddaojaafsyuqyx.supabase.co","sb_publishable_cONDiKoAkuwQQMv9x8zVag_M-Xd2Wa6");

const STAGES=['Lead','Design','Quoted','Accepted','Deposit in','Materials ordered','On site','Complete','Invoiced','Paid'];
const BOOKED=['Accepted','Deposit in','Materials ordered','On site'];
const PENCIL=['Lead','Design','Quoted'];
const S={user:null,profile:null,view:'jobs',jobs:[],tasks:[],rates:[],settings:{},crew:[],crewDays:[],costs:[],camps:[],draft:null,jobId:null};
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,dp=0)=>n==null||isNaN(n)?'–':(n<0?'-':'')+'$'+Math.abs(+n).toLocaleString('en-AU',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const r1=n=>Math.round((+n||0)*10)/10;
const pct=n=>isFinite(n)?Math.round(n*100)+'%':'–';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
const role=()=>S.profile?.role;
const isStaff=()=>['owner','admin'].includes(role());
const isMkt=()=>role()==='marketing';
const DAY_RATE=()=>+(S.settings.labour_rate||75)*(+(S.settings.hours_per_day)||8);

/* ---------- dates ---------- */
const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const isWork=d=>(S.settings.work_days||[1,2,3,4,5]).includes(d.getDay()===0?7:d.getDay());
const nextWork=d=>{const x=new Date(d);while(!isWork(x))x.setDate(x.getDate()+1);return x};
function nthWorkDay(start,n){let x=nextWork(start);for(let i=0;i<n;i++){x.setDate(x.getDate()+1);x=nextWork(x)}return x}
const addWorkDays=(start,n)=>nthWorkDay(start,Math.max(1,Math.ceil(n))-1);
const fmtD=s=>s?parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtShort=s=>s?parse(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'';
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function workDaysBetween(a,b){let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(isWork(d))n++;return n}
const jobHours=ts=>ts.reduce((a,t)=>a+(+t.est_hours||0),0);
function jobDays(ts,crew){return Math.max(1,Math.ceil(jobHours(ts)/((crew||S.settings.default_crew||2)*(S.settings.hours_per_day||8))))}
function layoutTasks(job,tasks){const hpd=S.settings.hours_per_day||8,start=parse(job.start_date);let cum=0;
  for(const t of tasks){const crew=t.crew_size||job.crew_size||S.settings.default_crew||2;const days=(+t.est_hours||0)/(crew*hpd);
    const a=Math.floor(cum+1e-6),b=Math.max(a,Math.ceil(cum+days-1e-6)-1);t.start_date=iso(nthWorkDay(start,a));t.end_date=iso(nthWorkDay(start,b));cum+=days}return tasks}

/* ---------- capacity ---------- */
function activeCrew(){return Math.max(1,S.crew.filter(c=>c.active!==false).length)}
function bookedCrewOn(d,{includePencil=false}={}){let n=0;const ds=iso(d);
  for(const j of S.jobs){if(!j.start_date||!j.end_date)continue;const ok=BOOKED.includes(j.stage)||(includePencil&&PENCIL.includes(j.stage));if(!ok)continue;
    if(ds>=j.start_date&&ds<=j.end_date)n+=(j.crew_size||S.settings.default_crew||2)}return n}
function weeksAhead(n=12){const out=[];let m=monday(today0());if(!isWork(today0())&&today0().getDay()===0)m.setDate(m.getDate()+7);
  for(let w=0;w<n;w++){const ws=new Date(m);ws.setDate(ws.getDate()+w*7);let cap=0,booked=0,pencil=0;
    for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(!isWork(d)||d<today0())continue;cap+=activeCrew();const b=bookedCrewOn(d);booked+=Math.min(b,activeCrew());pencil+=Math.min(bookedCrewOn(d,{includePencil:true}),activeCrew())-Math.min(b,activeCrew())}
    out.push({ws,cap,booked,pencil,free:Math.max(0,cap-booked-pencil),fill:cap?booked/cap:0})}return out}
function avgJobCrewDays(){const done=jobNumbers().filter(n=>n.actualDays>0);if(done.length)return done.reduce((a,n)=>a+n.actualDays,0)/done.length;
  const q=S.jobs.map(j=>jobHours(tasksFor(j.id))/(S.settings.hours_per_day||8)).filter(x=>x>0);return q.length?q.reduce((a,b)=>a+b,0)/q.length:8}
function nextFreeStart(excludeId,crewNeed){crewNeed=crewNeed||S.settings.default_crew||2;let d=nextWork(new Date(today0().getTime()+864e5));
  for(let i=0;i<180;i++){if(isWork(d)&&activeCrew()-bookedCrewOn(d,{includePencil:true})>=crewNeed)return d;d.setDate(d.getDate()+1)}return d}

/* ---------- data ---------- */
async function loadAll(){
  const q={jobs:sb.from('jobs').select('*, clients(name,phone,email)').order('created_at',{ascending:false}),tasks:sb.from('job_tasks').select('*').order('seq'),settings:sb.from('settings').select('*').single(),crew:sb.from('crew').select('*').order('name')};
  if(isStaff()){q.rates=sb.from('rates').select('*').order('task_type');q.crewDays=sb.from('crew_days').select('*').order('work_date');q.costs=sb.from('job_costs').select('*')}
  if(isStaff()||isMkt())q.camps=sb.from('campaigns').select('*').order('week_start');
  const keys=Object.keys(q),res=await Promise.all(Object.values(q));
  keys.forEach((k,i)=>{S[k]=res[i].data||(k==='settings'?{}:[])});
}
const tasksFor=id=>S.tasks.filter(t=>t.job_id===id).sort((a,b)=>a.seq-b.seq);
const daysFor=id=>S.crewDays.filter(d=>d.job_id===id);
const costsFor=id=>S.costs.filter(c=>c.job_id===id);

/* ---------- the numbers ---------- */
function numbersFor(j){
  const ts=tasksFor(j.id),cd=daysFor(j.id),hpd=S.settings.hours_per_day||8;
  const quoteEx=j.quote_total?j.quote_total/1.1:ts.reduce((a,t)=>a+(+t.sell_price||0),0)||null;
  const qLabour=j.quoted_labour!=null?+j.quoted_labour:(jobHours(ts)*(+S.settings.labour_rate||0)||null);
  const qDays=j.quoted_crew_days!=null?+j.quoted_crew_days:(qLabour?qLabour/DAY_RATE():jobHours(ts)/hpd);
  const actualDays=cd.reduce((a,d)=>a+(+d.hours||0),0)/hpd;
  const varDays=cd.filter(d=>d.is_variation).reduce((a,d)=>a+(+d.hours||0),0)/hpd;
  const actualCharge=cd.reduce((a,d)=>a+(+d.charge||0),0);
  const actualCost=cd.reduce((a,d)=>a+(+d.cost||0),0);
  const lostDays=actualDays?Math.max(0,actualDays-varDays-(qDays||0)):0;
  const lostDollars=lostDays*DAY_RATE();
  const mats=costsFor(j.id).reduce((a,c)=>a+(+c.amount||0),0);
  return {j,quoteEx,qLabour,qDays,actualDays,varDays,actualCharge,actualCost,lostDays,lostDollars,mats,
    perDay:actualDays&&quoteEx?quoteEx/actualDays:null,overrun:qDays&&actualDays?(actualDays-varDays)/qDays-1:null};
}
function jobNumbers(){return S.jobs.map(numbersFor)}

/* ---------- auth ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{if(!!s!==!!S.user){S.user=s?.user||null;start()}});
  S.user=session?.user||null;start();
}
async function start(){
  if(!S.user)return renderLogin();
  const {data}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=data||{role:'pending',name:''};
  if(role()==='pending'){$('#root').innerHTML=`<div class="login"><div class="card"><h2>You're in the queue</h2><p class="small muted">Greg or Kaitlin needs to approve ${esc(S.user.email)} before you can see the hub.</p><button class="btn ghost block" id="lo">Log out</button></div></div>`;$('#lo').onclick=()=>sb.auth.signOut();return}
  S.view=isStaff()?'jobs':'board';
  $('#root').innerHTML='<div class="spinner" style="margin-top:40vh"></div>';
  await loadAll();render();
}
function renderLogin(){
  $('#root').innerHTML=`<div class="login"><div class="card">
    <div class="brand" style="color:var(--green-2)"><b>BECK'S LANDSCAPING</b><span style="color:var(--mut)">HUB</span></div>
    <p class="small muted" style="margin:12px 0 4px">Jobs, board, numbers.</p>
    <label>Email</label><input id="em" type="email" autocomplete="email" placeholder="you@email.com">
    <button class="btn block" style="margin-top:12px" id="go">Email me a login link</button>
    <p class="small muted" id="msg" style="margin:10px 0 0">No password. Tap the link in your email.</p></div></div>`;
  $('#go').onclick=async()=>{const email=$('#em').value.trim();if(!email)return;$('#go').disabled=true;
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    $('#msg').textContent=error?error.message:'Check your email and tap the link.';$('#go').disabled=false};
}

/* ---------- shell ---------- */
const IC={
 jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h9M6 12h12M10 18h11"/></svg>',
 add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',

/* ---------- board: gantt + capacity ---------- */
function viewBoard(el){
  const live=S.jobs.filter(j=>j.start_date&&j.end_date&&!['Lost','Paid'].includes(j.stage)&&j.end_date>=iso(new Date(today0().getTime()-14*864e5))).sort((a,b)=>a.start_date.localeCompare(b.start_date));

  <div class="card"><div class="row between"><h2>Crew days booked per week</h2><span class="tiny muted">of ${activeCrew()*5} available</span></div>
   <div class="weeks">${wks.map(w=>{const f=w.cap?w.booked/w.cap:0,p=w.cap?w.pencil/w.cap:0;return `<div class="wk" data-tip="Week of ${w.ws.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}: ${r1(w.booked)} booked, ${r1(w.pencil)} pencilled, ${r1(w.free)} free of ${w.cap}"><b>${w.ws.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</b>
     <div class="bar"><i style="height:${Math.min(100,f*100)}%"></i><i style="height:${Math.min(100,(f+p)*100)}%;background:repeating-linear-gradient(45deg,#c9a96e 0 4px,#d6bb87 4px 8px);z-index:0;opacity:.9"></i><i style="height:${Math.min(100,f*100)}%;z-index:1"></i></div><span>${r1(w.free)} free</span></div>`}).join('')}</div>
   <div class="legend"><span><b style="background:var(--green)"></b>Booked</span><span><b style="background:repeating-linear-gradient(45deg,#c9a96e 0 4px,#d6bb87 4px 8px)"></b>Quoted, pencilled in</span><span><b style="background:#efece4;border:1px solid var(--line)"></b>Free</span></div></div>
  <h2 style="margin:18px 0 8px">Every job on the board</h2>

   ${live.map(j=>{const s=Math.max(0,idx(j.start_date)),e=idx(j.end_date);return `<div class="g-row"><div class="g-lab" data-id="${j.id}">${esc(isMkt()?(j.suburb||'Job'):(j.clients?.name||j.title||'Job'))}<small>${esc(isMkt()?j.title||'':j.suburb||'')} · ${j.crew_size||2} crew</small></div>
    <div class="g-lane" style="width:${days.length*W}px">${days.map((d,k)=>isWork(d)?'':`<div style="position:absolute;left:${k*W}px;top:0;bottom:0;width:${W}px;background:#f6f3ec"></div>`).join('')}
    <div style="position:absolute;left:${idx(iso(t0))*W+W/2}px;top:0;bottom:0;width:1px;background:var(--bad);opacity:.5"></div>
    <div class="g-bar ${cls(j)}" data-id="${j.id}" data-tip="${esc((j.clients?.name&&!isMkt()?j.clients.name+' · ':'')+j.stage+' · '+fmtShort(j.start_date)+' to '+fmtShort(j.end_date))}" style="left:${s*W+2}px;width:${Math.max(1,e-s+1)*W-4}px">${esc(j.stage)}${j.title?' · '+esc(j.title):''}</div></div></div>`}).join('')}
  </div></div>

  ${isStaff()?`<div class="card"><h2>This week on site</h2>${weekList(live,monday(t0))}</div>`:''}`;

function weekList(jobs,from){const end=new Date(from);end.setDate(end.getDate()+6);const items=[];
  for(const j of jobs)for(const t of tasksFor(j.id)){if(!t.start_date)continue;const s=parse(t.start_date),e=parse(t.end_date||t.start_date);if(e<from||s>end)continue;items.push({j,t,s})}
  items.sort((a,b)=>a.s-b.s);
  return items.length?`<table style="margin-top:6px">${items.map(({j,t})=>`<tr><td class="small" style="width:84px">${fmtD(t.start_date)}</td><td><b class="small">${esc(t.task_type)}</b><div class="tiny muted">${esc(j.clients?.name||'')} · ${esc(j.suburb||'')}</div></td><td class="num small">${r1(t.est_hours)}h</td></tr>`).join('')}</table>`:`<p class="small muted">Nothing on this week.</p>`}
function bindTips(el){const tip=$('#tip');el.querySelectorAll('[data-tip]').forEach(n=>{
  n.addEventListener('pointerenter',e=>{tip.textContent=n.dataset.tip;tip.style.opacity=1});
  n.addEventListener('pointermove',e=>{tip.style.left=Math.min(innerWidth-250,e.clientX+12)+'px';tip.style.top=(e.clientY-36)+'px'});
  n.addEventListener('pointerleave',()=>tip.style.opacity=0)})}

function viewNumbers(el){

  const owed=S.jobs.filter(j=>['Complete','Invoiced'].includes(j.stage)).reduce((a,j)=>a+(+j.invoiced_total||+j.quote_total||0),0);
  const pipeline=S.jobs.filter(j=>['Lead','Design','Quoted'].includes(j.stage)).reduce((a,j)=>a+(+j.quote_total||0),0);

  <div class="hero"><div class="eyebrow">Labour given away</div><div class="big">${money(lost)}</div>
   <p>${r1(lostDays)} crew days worked past the quote on finished jobs, not counting variations, at ${money(DAY_RATE())} a crew day.${qd?` Jobs ran ${pct(ad/qd-1)} over the quoted days.`:''}</p></div>
  <div class="kpis">
   <div class="kpi"><div class="eyebrow">Earned per crew day</div><div class="v">${isFinite(avgPerDay)?money(avgPerDay):'–'}</div><div class="s">Quote ex GST divided by crew days actually worked</div></div>
   <div class="kpi"><div class="eyebrow">Quote win rate</div><div class="v">${pct(winRate)}</div><div class="s">${won.length} won of ${decided.length} decided${decided.length<5?'. Needs more jobs to mean much':''}</div></div>

   <div class="kpi ${owed?'alert':''}"><div class="eyebrow">To invoice or chase</div><div class="v">${money(owed)}</div><div class="s">Finished or invoiced, not paid</div></div>
  </div>
  <div class="card"><div class="row between"><h2>Quoted vs worked, crew days</h2></div>
   <p class="small muted" style="margin:4px 0 0">Each finished job. The gap is time Greg didn't charge for.</p>
   ${finished.length?daysChart(finished):'<p class="small muted">Log crew days on a finished job to see this.</p>'}</div>
  <div class="card"><h2>Job by job</h2><table style="margin-top:8px"><thead><tr><th>Job</th><th class="num">Quoted</th><th class="num">Worked</th><th class="num">Variation</th><th class="num">Over</th></tr></thead><tbody>
   ${finished.map(n=>`<tr data-id="${n.j.id}" style="cursor:pointer"><td><b class="small">${esc(n.j.clients?.name||'')}</b><div class="tiny muted">${esc(n.j.suburb||'')}</div></td><td class="num">${r1(n.qDays)}d</td><td class="num">${r1(n.actualDays)}d</td><td class="num">${r1(n.varDays)}d</td><td class="num" style="color:${n.lostDollars>0?'var(--bad)':'var(--good)'};font-weight:600">${money(n.lostDollars)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted small">No crew logs yet</td></tr>'}

  <div class="card small muted">How lost labour is worked out: crew days logged minus variation days minus quoted crew days, times ${money(DAY_RATE())}. Quoted crew days come from the labour figure on the quote divided by ${money(DAY_RATE())}. <a href="#" id="toRates" style="color:var(--green-2)">Rates and day rate</a></div>`;
  el.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>go('job',r.dataset.id));

function daysChart(list){
  const rowH=52,padL=100,padR=34,w=360,h=list.length*rowH+34;const max=Math.max(...list.map(n=>Math.max(n.qDays||0,n.actualDays)))*1.1||1;
  const x=v=>padL+(w-padL-padR)*v/max;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Quoted versus worked crew days per job">
   ${list.map((n,i)=>{const y=i*rowH+8,base=n.actualDays-n.varDays;return `
    <text x="0" y="${y+14}" class="lbl">${esc((n.j.clients?.name||'').slice(0,15))}</text><text x="0" y="${y+30}">${esc(n.j.suburb||'')}</text>
    <rect x="${padL}" y="${y}" width="${Math.max(4,x(n.qDays||0)-padL)}" height="14" rx="4" fill="#a9bcbe" data-tip="Quoted: ${r1(n.qDays)} crew days"/>
    <rect x="${padL}" y="${y+18}" width="${Math.max(4,x(base)-padL)}" height="14" rx="4" fill="#2c3d40" data-tip="Worked on quoted scope: ${r1(base)} crew days"/>
    ${n.varDays?`<rect x="${x(base)+2}" y="${y+18}" width="${Math.max(3,x(n.actualDays)-x(base)-2)}" height="14" rx="4" fill="#c9a96e" data-tip="Variation: ${r1(n.varDays)} crew days"/>`:''}
    <text x="${x(n.qDays||0)+6}" y="${y+11}">${r1(n.qDays)}</text>
    <text x="${x(n.actualDays)+6}" y="${y+29}" class="lbl">${r1(n.actualDays)}</text>`}).join('')}
   <g transform="translate(0,${h-8})"><rect width="10" height="10" y="-9" rx="2" fill="#a9bcbe"/><text x="14">Quoted</text><rect x="68" width="10" height="10" y="-9" rx="2" fill="#2c3d40"/><text x="82">Worked</text><rect x="136" width="10" height="10" y="-9" rx="2" fill="#c9a96e"/><text x="150">Variation</text></g>
  </svg>`}

   <button class="btn block" style="margin-top:12px" id="build">Build the job</button>
   <button class="btn ghost block" style="margin-top:8px" id="manual">Enter it myself</button></div>`;
  const th=()=>$('#th').innerHTML=S.draft.images.map((src,i)=>`<img src="${src}" data-i="${i}" title="Tap to remove">`).join('');
  th();$('#th').onclick=e=>{if(e.target.dataset.i!=null){S.draft.images.splice(+e.target.dataset.i,1);th()}};
  $('#tx').oninput=e=>S.draft.transcript=e.target.value;
  $('#ph').onchange=async e=>{for(const f of e.target.files)S.draft.images.push(await shrink(f));th()};
  $('#mic').onclick=()=>{if(!SR){$('#tx').focus();return}if(rec){rec.stop();return}
    rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;const base=S.draft.transcript?S.draft.transcript.trim()+' ':'';let fin='';
    rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else interim+=r[0].transcript}$('#tx').value=base+fin+interim;S.draft.transcript=base+fin};
    rec.onend=()=>{rec=null;$('#mic')?.classList.remove('live');$('#ms')&&($('#ms').textContent='Tap to keep talking');S.draft.transcript=$('#tx').value};
    rec.onerror=ev=>toast(ev.error==='not-allowed'?'Allow the microphone in settings':'Mic stopped');
    rec.start();$('#mic').classList.add('live');$('#ms').textContent='Listening. Tap to stop'};
  $('#manual').onclick=()=>{S.draft.job={tasks:[{task_type:'',description:'',est_hours:8}]};go('review')};
  $('#build').onclick=async()=>{S.draft.transcript=$('#tx').value.trim();
    if(!S.draft.transcript&&!S.draft.images.length)return toast('Add a photo or talk first');
    $('#build').disabled=true;$('#build').textContent='Reading it…';
    const {data,error}=await sb.functions.invoke('parse-job',{body:{transcript:S.draft.transcript,images:S.draft.images}});
    $('#build').disabled=false;$('#build').textContent='Build the job';
    let msg=data?.error;if(error&&!msg){try{msg=(await error.context.json()).error}catch{msg=error.message}}
    if(msg||!data?.job)return toast(msg||'Could not read that. Try again.');
    S.draft.job=data.job;go('review')};
}
function shrink(file,max=1800){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};img.src=URL.createObjectURL(file)})}

/* ---------- review ---------- */
function crewMatch(name){const n=(name||'').toLowerCase().trim();return S.crew.find(c=>c.name.toLowerCase()===n)||S.crew.find(c=>n&&c.name.toLowerCase().startsWith(n.slice(0,3)))}

    if(rows.length)await sb.from('job_tasks').insert(rows);

  if((att||[]).length){const urls=await Promise.all(att.map(a=>sb.storage.from('job-files').createSignedUrl(a.path,3600)));$('#atts').innerHTML=urls.map(u=>u.data?`<a href="${u.data.signedUrl}" target="_blank"><img src="${u.data.signedUrl}"></a>`:'').join('')}
}
function xeroLines(j,ts){const rate=+S.settings.labour_rate||0;const lines=[`${j.clients?.name||''} · ${[j.address,j.suburb].filter(Boolean).join(', ')}`,j.title||'',''];let sub=0;
  for(const t of ts){const price=t.sell_price??(rate&&t.est_hours?(+t.est_hours)*rate:null);if(price)sub+=+price;
    lines.push(`${t.task_type}${t.description?' · '+t.description:''}${t.qty?` (${t.qty} ${t.unit||''})`:''}  ${price?money(price,2):'price TBC'}`)}
  const gst=sub*(S.settings.gst_rate??.1);lines.push('',`Subtotal ${money(sub,2)}   GST ${money(gst,2)}   Total ${money(sub+gst,2)}`,'Check before sending.');return lines.join('\n')}
async function setStage(j,stage,ts){
  if(stage==='Complete'&&!daysFor(j.id).length&&!confirm('No crew days logged. The numbers learn from these. Mark complete anyway?'))return;
  const patch={stage};if(['Complete','Lost'].includes(stage))patch.closed_at=new Date().toISOString();
  await sb.from('jobs').update(patch).eq('id',j.id);await sb.from('checkpoints').insert({job_id:j.id,stage});
  if(stage==='Complete'){const {data:n}=await sb.rpc('learn_from_job',{p_job:j.id});if(n)toast(`Rates updated from ${n} task${n>1?'s':''}`);else toast('Complete')}else toast(stage);
  await loadAll();render()}

/* ---------- rates ---------- */
async function viewRates(el){
  const {data:log}=await sb.from('learning_log').select('*').order('created_at',{ascending:false}).limit(12);
  el.innerHTML=`<div style="margin:18px 0 4px"><button class="btn light sm" id="back">‹ Numbers</button></div><h1 style="margin-top:10px">Rates</h1>
  <div class="card"><h2>Day rate</h2><div class="split"><div><label>Labour $/hr ex GST</label><input id="lr" inputmode="decimal" value="${S.settings.labour_rate??''}"></div><div><label>Hours per day</label><input id="hpd" inputmode="decimal" value="${S.settings.hours_per_day??8}"></div></div>
   <label>Usual crew per job</label><input id="dc" inputmode="numeric" value="${S.settings.default_crew??2}"><p class="small muted" style="margin:8px 0 0">${money(DAY_RATE())} per crew day.</p>
   <button class="btn light sm" id="ss" style="margin-top:10px">Save</button></div>
  <div class="card"><h2>Crew</h2><p class="small muted" style="margin:4px 0 8px">Charge per day drives the numbers. Add what each person costs Greg to see true margin.</p>
   <table><thead><tr><th>Name</th><th class="num">Charge/day</th><th class="num">Cost/day</th></tr></thead><tbody>
   ${S.crew.map(c=>`<tr><td class="small">${esc(c.name)}</td><td class="num" style="width:100px"><input data-crew="${c.id}" data-k="charge_per_day" value="${c.charge_per_day??''}" inputmode="decimal" style="text-align:right"></td><td class="num" style="width:100px"><input data-crew="${c.id}" data-k="cost_per_day" value="${c.cost_per_day??''}" inputmode="decimal" style="text-align:right" placeholder="?"></td></tr>`).join('')}
   </tbody></table><div class="row" style="margin-top:8px;gap:8px"><input id="nc" placeholder="New crew member"><button class="btn light sm" id="ncadd">Add</button></div></div>
  <div class="card"><h2>Time and price per unit</h2><table style="margin-top:6px"><thead><tr><th>Item</th><th>Unit</th><th class="num">Hrs</th><th class="num">Price</th></tr></thead><tbody>
   ${S.rates.map(r=>`<tr><td class="small">${esc(r.task_type)}${r.samples?` <span class="pill">${r.samples} jobs</span>`:''}</td><td class="small muted">${esc(r.unit)}</td><td class="num" style="width:70px"><input data-rid="${r.id}" data-k="hours_per_unit" value="${r.hours_per_unit??''}" inputmode="decimal" style="text-align:right"></td><td class="num" style="width:84px"><input data-rid="${r.id}" data-k="sell_rate_per_unit" value="${r.sell_rate_per_unit??''}" inputmode="decimal" style="text-align:right"></td></tr>`).join('')}
   </tbody></table></div>
  <div class="card"><h2>What it learned</h2>${(log||[]).length?`<table style="margin-top:6px">${log.map(l=>`<tr><td class="small">${esc(l.task_type)}<div class="tiny muted">est ${r1(l.est_hours)}h, actual ${r1(l.actual_hours)}h</div></td><td class="num small">${l.old_hours_per_unit==null?'new':Math.round(l.old_hours_per_unit*100)/100+' →'} <b>${Math.round(l.new_hours_per_unit*100)/100}</b></td></tr>`).join('')}</table>`:'<p class="small muted">Nothing yet. Finish a job with actual hours on its tasks.</p>'}</div>`;
  $('#back').onclick=()=>go('nums');
  $('#ss').onclick=async()=>{const p={labour_rate:+$('#lr').value||null,hours_per_day:+$('#hpd').value||8,default_crew:+$('#dc').value||2};await sb.from('settings').update(p).eq('id',1);Object.assign(S.settings,p);toast('Saved');render()};
  el.querySelectorAll('[data-crew]').forEach(i=>i.onchange=async()=>{await sb.from('crew').update({[i.dataset.k]:i.value===''?null:+i.value}).eq('id',i.dataset.crew);toast('Saved');await loadAll()});
  $('#ncadd').onclick=async()=>{const n=$('#nc').value.trim();if(!n)return;await sb.from('crew').insert({name:n,charge_per_day:DAY_RATE()});await loadAll();render()};
  el.querySelectorAll('[data-rid]').forEach(i=>i.onchange=async()=>{await sb.from('rates').update({[i.dataset.k]:i.value===''?null:+i.value,updated_at:new Date().toISOString()}).eq('id',i.dataset.rid);toast('Saved')});
}

/* ---------- me ---------- */
async function viewMe(el){
  el.innerHTML=`<div class="card" style="margin-top:18px"><h2>${esc(S.profile.name||S.user.email)}</h2><p class="small muted">${esc(S.user.email)} · ${esc(role())}</p>
   ${isStaff()?`<button class="btn light sm" id="toRates" style="margin-right:6px">Rates and crew</button>`:''}<button class="btn ghost sm" id="lo">Log out</button></div>
  ${isStaff()?`<div class="card"><h2>Team</h2><p class="small muted" style="margin:4px 0 8px">New logins wait here. Crew see the board only. Marketing sees the board and campaigns, no money.</p><div id="team"><div class="spinner"></div></div></div>`:''}
  <div class="card small muted">Add to home screen: tap Share, then Add to Home Screen.</div>`;
  $('#lo').onclick=()=>sb.auth.signOut();$('#toRates')&&($('#toRates').onclick=()=>go('rates'));
  if(!isStaff())return;
  const {data:people}=await sb.from('profiles').select('*').order('created_at');
  $('#team').innerHTML=(people||[]).map(p=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid #f1ede3"><b class="small">${esc(p.name||'')}</b>
   <select data-pid="${p.id}" style="width:auto" ${p.id===S.user.id?'disabled':''}>${['pending','crew','marketing','admin','owner'].map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select></div>`).join('');
  el.querySelectorAll('[data-pid]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('profiles').update({role:s.value}).eq('id',s.dataset.pid);toast(error?error.message:'Updated')});
}

boot();
</script>
</body>
