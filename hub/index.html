function timingCard(j){
  const r=replyStatus(j),q=quoteStatus(j),p=promiseOf(j),e=j.enquiry||null;
  const open=OPEN.includes(j.stage)&&j.stage!=='On site';
  if(!e&&!r&&!q&&!p&&!open)return '';
  const line=(lvl,t)=>`<div class="row" style="gap:8px;margin:6px 0"><span class="pill ${lvl}">${lvl==='bad'?'Late':lvl==='warn'?'Due':lvl==='good'?'On track':'Info'}</span><span class="small">${t}</span></div>`;
  const pl={late:'bad',soon:'warn',booked:'good',ok:'grey'};
  return `<div class="card"><div class="row between"><h2>Timing</h2>${j.stage==='Lead'&&!j.contacted_at&&S.dbReady?`<button class="btn sm" id="contacted">Mark contacted</button>`:''}</div>
   ${r?line(r.late?'bad':r.left===0?'warn':'grey',`Reply by ${fmtD(iso(r.due))}`):j.contacted_at&&['Lead','Design'].includes(j.stage)?line('good',`Contacted ${fmtShort(String(j.contacted_at).slice(0,10))}`):''}
   ${q?line(q.late?'bad':q.soon?'warn':'grey',`Quote due ${fmtD(iso(q.due))}, ${S.settings.quote_due_days??7} days from ${j.stage==='Design'?'the design':'the enquiry'}`):''}
   ${p&&p.state!=='done'?line(pl[p.state],`Told the client ${p.label} on ${fmtShort(j.promised_on)}. ${p.msg}`):''}
   ${open?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #ece9e1"><b class="small">What Greg told the client</b>
    <div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap">
     <div style="width:84px"><label for="pw1">From</label><input id="pw1" inputmode="numeric" value="${j.promised_weeks_min??''}" placeholder="8"></div>
     <div style="width:84px"><label for="pw2">To</label><input id="pw2" inputmode="numeric" value="${j.promised_weeks_max??''}" placeholder="10"></div>
     <span class="small muted" style="padding-bottom:12px">weeks</span>
     <div style="flex:1;min-width:150px"><label for="pon">Said on</label><input id="pon" type="date" value="${j.promised_on||iso(today0())}"></div>
     <button class="btn light sm" id="psave" style="margin-bottom:4px">Save</button></div></div>`:''}
   ${e?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #ece9e1"><b class="small">From the website</b>
    <div class="small muted" style="margin-top:4px;line-height:1.6">${[(e.project_types||[]).join(', '),e.budget&&'Budget '+e.budget,e.start_pref&&'Start '+e.start_pref,e.contact_pref&&'Prefers '+e.contact_pref,e.enquiring_as,j.lead_source&&'Found us via '+j.lead_source].filter(Boolean).map(esc).join(' · ')}</div></div>`:''}
  </div>`}
function bindTiming(el,j){
  $('#contacted')&&($('#contacted').onclick=async()=>{const {error}=await sb.from('jobs').update({contacted_at:new Date().toISOString()}).eq('id',j.id);if(error)return toast(error.message);await loadAll();toast('Marked contacted');render()});
  $('#psave')&&($('#psave').onclick=async()=>{const a=+$('#pw1').value||null,b=+$('#pw2').value||a;if(!a&&$('#pw1').value!=='')return toast('Add the weeks');
    const {error}=await sb.from('jobs').update({promised_weeks_min:a,promised_weeks_max:a?Math.max(a,b):null,promised_on:a?$('#pon').value:null}).eq('id',j.id);
    if(error)return toast(S.dbReady?error.message:'Needs the database update first');await loadAll();toast(a?'Promise saved. It shows on the board.':'Promise cleared');render()});
}
function quoteXero(j){const q=quoteCalc(j);const lines=[`${j.clients?.name||''} · ${[j.address,j.suburb].filter(Boolean).join(', ')}`,j.title||''];
  for(const l of q.ls)lines.push(`${l.item}${l.description?' · '+l.description:''}${l.qty?` (${l.qty} ${l.unit||''})`:''}  ${money(lineSell(l),2)}`);
  lines.push('',`Subtotal ${money(q.sell,2)}   GST ${money(q.gst,2)}   Total ${money(q.inc,2)}`);const dp=+(j.deposit_pct??S.settings.deposit_pct??0);if(dp)lines.push(`Deposit ${dp}%: ${money(q.inc*dp/100,2)} inc GST`);return lines.join('\n')}
function xeroLines(j,ts){const rate=+S.settings.labour_rate||0;const lines=[`${j.clients?.name||''} · ${[j.address,j.suburb].filter(Boolean).join(', ')}`,j.title||'',''];let sub=0;
  for(const t of ts){const price=t.sell_price??(rate&&t.est_hours?(+t.est_hours)*rate:null);if(price)sub+=+price;
    lines.push(`${t.task_type}${t.description?' · '+t.description:''}${t.qty?` (${t.qty} ${t.unit||''})`:''}  ${price?money(price,2):'price TBC'}`)}
  const gst=sub*(S.settings.gst_rate??.1);lines.push('',`Subtotal ${money(sub,2)}   GST ${money(gst,2)}   Total ${money(sub+gst,2)}`,'Check before sending.');return lines.join('\n')}
async function setStage(j,stage,ts){
  if(stage==='Complete'&&!daysFor(j.id).length&&!confirm('No crew days logged. The numbers learn from these. Mark complete anyway?'))return;
  const patch={stage};if(['Complete','Lost'].includes(stage))patch.closed_at=new Date().toISOString();
  await sb.from('jobs').update(patch).eq('id',j.id);await sb.from('checkpoints').insert({job_id:j.id,stage});
  if(stage==='Complete'){const {data:n}=await sb.rpc('learn_from_job',{p_job:j.id});if(n)toast(`Rates updated from ${n} task${n>1?'s':''}`);else toast('Complete')}else toast(stage);
  await loadAll();render()}

/* ---------- v3: day plan, quote builder, supplier orders ---------- */
const MK=()=>+(S.settings.default_markup_pct??25);
const plural=(n,a,b)=>n===1?a:b;
const planFor=id=>(S.plan||[]).filter(d=>d.job_id===id).sort((a,b)=>a.day_no-b.day_no);
const linesFor=id=>(S.qlines||[]).filter(l=>l.job_id===id).sort((a,b)=>a.seq-b.seq);
const ordersFor=id=>(S.orders||[]).filter(o=>o.job_id===id);
const KINDS=['Labour','Materials','Plant and hire','Subcontractor','Other'];
const lineSell=l=>{const q=+l.qty||0;if(l.unit_price!=null&&l.unit_price!=='')return q*(+l.unit_price);return q*(+l.unit_cost||0)*(1+((l.markup_pct??MK())/100))};
const lineCost=l=>(+l.qty||0)*(+l.unit_cost||0);
function quoteCalc(j){const ls=linesFor(j.id);const sell=ls.reduce((a,l)=>a+lineSell(l),0),cost=ls.reduce((a,l)=>a+lineCost(l),0);
  const by=k=>ls.filter(l=>l.kind===k).reduce((a,l)=>a+lineSell(l),0);const noCost=ls.filter(l=>l.unit_cost==null||l.unit_cost==='').length;
  const gst=sell*(S.settings.gst_rate??.1);const crewDays=ls.filter(l=>l.kind==='Labour').reduce((a,l)=>a+(+l.qty||0),0);
  return{ls,sell,cost,profit:sell-cost,margin:sell?(sell-cost)/sell:null,gst,inc:sell+gst,labour:by('Labour'),mats:by('Materials'),plant:by('Plant and hire'),subs:by('Subcontractor'),crewDays,noCost}}
function quoteState(j){if(j.quote_accepted_at)return['good',`Accepted by ${esc(j.quote_accepted_name||'client')} ${fmtShort(String(j.quote_accepted_at).slice(0,10))}`];
  if(j.quote_viewed_at)return['warn',`Client opened it ${fmtShort(String(j.quote_viewed_at).slice(0,10))}`];
  if(j.quote_sent_at)return['grey',`Sent ${fmtShort(String(j.quote_sent_at).slice(0,10))}, not opened yet`];return['grey','Draft']}
const dayDate=(j,d)=>d.work_date||(j.start_date?iso(addWorkDays(parse(j.start_date),d.day_no)):null);
const quoteUrl=j=>`${location.origin}/quote/?t=${j.quote_token}`;

/* local fallback when the plan reader is offline: split on "day one", "day 2" */
function localPlan(text){const W={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,first:1,second:2,third:3,fourth:4,fifth:5};
  const parts=text.split(/\bday\s+(\d+|one|two|three|four|five|six|seven|eight|nine|ten|first|second|third|fourth|fifth)\b[\s,:.-]*/i);const days=[];
  for(let i=1;i<parts.length;i+=2){const n=+parts[i]||W[parts[i].toLowerCase()]||days.length+1;const steps=parts[i+1].split(/,|\.|\bthen\b|\band then\b/i).map(s=>s.trim()).filter(s=>s.length>2);
    days.push({day_no:n,title:steps[0]?steps[0][0].toUpperCase()+steps[0].slice(1):'Day '+n,steps:steps.map(s=>s[0].toUpperCase()+s.slice(1))})}
  return{days,tools:[],est_days:days.length||null}}

function planCard(j){
  const ds=planFor(j.id),tools=j.tools||[];
  if(S.v3===false)return `<div class="card"><h2>Job plan</h2><p class="small muted" style="margin:6px 0 0">Day by day plans, tools, quotes and supplier orders switch on once the database update has run.</p></div>`;
  return `<div class="card" id="plancard"><div class="row between"><h2>Job plan</h2><span class="small muted">${j.est_days?r1(j.est_days)+' days':ds.length?ds.length+' days':''}${j.crew_size?' · '+j.crew_size+' crew':''}</span></div>
   <div style="margin-top:10px"><b class="small">Tools and plant</b><div class="chips" id="tools" style="margin-top:6px">${tools.map((t,i)=>`<span class="chip on" style="display:inline-flex;gap:6px;align-items:center">${esc(t)}<button data-tdel="${i}" aria-label="Remove ${esc(t)}" style="border:0;background:none;cursor:pointer;font-size:15px;line-height:1;color:inherit">×</button></span>`).join('')||'<span class="small muted">None yet</span>'}</div>
    <div class="row" style="gap:8px;margin-top:8px"><input id="tnew" placeholder="Add a tool, e.g. 1.7t excavator"><button class="btn light sm" id="tadd">Add</button></div></div>
   <div style="margin-top:14px">${ds.map(d=>{const dt=dayDate(j,d);return `<div class="pday" data-did="${d.id}" style="border-top:1px solid #ece9e1;padding:10px 0">
     <div class="row between"><b class="small">Day ${d.day_no}${dt?` · ${fmtD(dt)}`:''}</b><button class="btn light sm" data-dedit="${d.id}">Edit</button></div>
     <div class="small" style="margin-top:2px">${esc(d.title||'')}</div>
     ${(d.steps||[]).length?`<ul class="small muted" style="margin:6px 0 0;padding-left:18px">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
     ${(d.tools||[]).length?`<div class="tiny muted" style="margin-top:4px">Bring: ${d.tools.map(esc).join(', ')}</div>`:''}</div>`}).join('')||'<p class="small muted" style="margin:0">No plan yet. Talk it through below, day by day.</p>'}</div>
   <div style="margin-top:12px;padding-top:12px;border-top:1px solid #ece9e1"><b class="small">Talk the plan through</b>
    <p class="tiny muted" style="margin:2px 0 6px">e.g. Day one dig out, levelling, solenoid check, start the retaining wall. Day two finish the wall and backfill. Need the 1.7 tonne excavator and plate compactor.</p>
    <textarea id="ptx" data-mic style="min-height:80px" placeholder="Tap the mic and talk it through">${esc(j.plan_transcript||'')}</textarea>
    <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" id="pbuild">Build the plan</button><button class="btn light sm" id="padd">+ Add a day</button></div>
    <div id="pprev"></div></div></div>`}

function bindPlan(el,j){

  $('#padd').onclick=async()=>{const n=planFor(j.id).length+1;const {error}=await sb.from('job_plan_days').insert({job_id:j.id,day_no:n,title:'Day '+n,steps:[]});if(error)return toast(error.message);await loadAll();render()};
  el.querySelectorAll('[data-dedit]').forEach(b=>b.onclick=()=>{const d=planFor(j.id).find(x=>x.id===b.dataset.dedit);const box=el.querySelector(`.pday[data-did="${d.id}"]`);
    box.innerHTML=`<div class="split"><div><label>Day</label><input id="de_n" inputmode="numeric" value="${d.day_no}"></div><div><label>Date (optional)</label><input id="de_d" type="date" value="${d.work_date||''}"></div></div>

    $('#de_save').onclick=async()=>{const p={day_no:+$('#de_n').value||d.day_no,work_date:$('#de_d').value||null,title:$('#de_t').value.trim(),steps:$('#de_s').value.split('\n').map(s=>s.trim()).filter(Boolean),tools:$('#de_tools').value.split(',').map(s=>s.trim()).filter(Boolean)};
      const {error}=await sb.from('job_plan_days').update(p).eq('id',d.id);if(error)return toast(error.message);await loadAll();toast('Saved');render()};
    $('#de_del').onclick=async()=>{await sb.from('job_plan_days').delete().eq('id',d.id);await loadAll();toast('Day removed');render()};
    });
  $('#pbuild').onclick=async()=>{const tx=$('#ptx').value.trim();if(!tx)return toast('Talk it through first');$('#pbuild').disabled=true;$('#pbuild').textContent='Reading it…';
    let plan=null,msg=null;try{const {data,error}=await sb.functions.invoke('parse-plan',{body:{transcript:tx,job_id:j.id}});plan=data?.plan||null;msg=data?.error||null;if(error&&!plan)msg=msg||'offline'}catch(e){msg='offline'}
    if(!plan){plan=localPlan(tx);if(!plan.days.length){$('#pbuild').disabled=false;$('#pbuild').textContent='Build the plan';return toast('Say it day by day, e.g. "Day one dig out"')}}
    $('#pbuild').disabled=false;$('#pbuild').textContent='Build the plan';

    $('#pprev').innerHTML=`<div class="card" style="margin:12px 0 0;background:var(--green-xl,#eef3f3)"><b class="small">Check it, then save</b>${msg?`<p class="tiny muted" style="margin:4px 0 0">Read on the phone, not the full reader. Check the steps.</p>`:''}
     ${(plan.questions||[]).map(q=>`<div class="q">${esc(q)}</div>`).join('')}
     <p class="small" style="margin:6px 0">${plan.est_days?`<b>${r1(plan.est_days)} days</b>`:''}${plan.crew_size?` · ${plan.crew_size} crew`:''}${(plan.tools||[]).length?` · Tools: ${plan.tools.map(esc).join(', ')}`:''}</p>
     ${plan.days.map(d=>`<div style="margin:6px 0"><b class="small">Day ${d.day_no}: ${esc(d.title||'')}</b>${(d.steps||[]).length?`<ul class="small muted" style="margin:2px 0 0;padding-left:18px">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>`).join('')}
     <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" id="psave">${planFor(j.id).length?'Replace the plan':'Save the plan'}</button><button class="btn light sm" id="pcancel">Cancel</button></div></div>`;
    $('#pcancel').onclick=()=>{S.planDraft=null;$('#pprev').innerHTML=''};
    $('#psave').onclick=async()=>{const p=S.planDraft.plan;
      await sb.from('job_plan_days').delete().eq('job_id',j.id);
      const rows=p.days.map((d,i)=>({job_id:j.id,day_no:d.day_no||i+1,title:d.title||null,steps:d.steps||[],crew:d.crew||null,tools:d.tools||[]}));
      if(rows.length){const {error}=await sb.from('job_plan_days').insert(rows);if(error)return toast(error.message)}

      if((p.tools||[]).length)patch.tools=[...new Set([...(j.tools||[]),...p.tools])];if(p.crew_size)patch.crew_size=p.crew_size;
      await sb.from('jobs').update(patch).eq('id',j.id);S.planDraft=null;await loadAll();toast('Plan saved. The crew can see it.');render()}};
}

    ${k==='Labour'?`<p class="tiny muted" style="margin:2px 0 6px">Charged at ${money(DAY_RATE())} a crew day. Cost is what the crew costs Greg.</p>`:''}
    ${ls.length?`<div style="overflow-x:auto"><table style="margin-top:6px;min-width:720px"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Cost each</th><th class="num">Markup %</th><th class="num">Sell each</th><th class="num">Line</th><th>${['Materials','Plant and hire','Subcontractor'].includes(k)?'Supplier':''}</th><th></th></tr></thead><tbody>${ls.map(row).join('')}</tbody></table></div>`:''}
    <div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn light sm" data-ladd="${k}">+ ${k==='Labour'?'Labour line':k==='Materials'?'Material':k==='Plant and hire'?'Hire item':k==='Subcontractor'?'Subbie':'Line'}</button>
     ${k==='Labour'?`<button class="btn light sm" id="labplan">Labour from the plan</button>`:''}</div></div>`}).join('')}
  <div class="card"><h2>What the client reads</h2>
   <label for="qi">Opening note</label><textarea id="qi" data-mic style="min-height:70px" placeholder="Thanks for having us out. Here's what we'll build and what it costs.">${esc(j.quote_intro||'')}</textarea>
   <label for="qe">Not included</label><textarea id="qe" data-mic style="min-height:60px" placeholder="e.g. Electrical, council approvals, tree removal">${esc(j.quote_exclusions||'')}</textarea>
   <div class="split"><div><label for="qv">Valid until</label><input id="qv" type="date" value="${vu}"></div><div><label for="qdp">Deposit %</label><input id="qdp" inputmode="decimal" value="${j.deposit_pct??S.settings.deposit_pct??30}"></div></div>
   <button class="btn light sm" id="qsave" style="margin-top:10px">Save</button></div>
  <div class="card"><h2>Send it</h2><p class="small muted" style="margin:4px 0 8px">Preview first. Mark it sent, then paste the link into a text or email to the client. They accept online and it lands here as Accepted. Deposit and final invoices still go from Xero.</p>
   <div class="row wrap" style="gap:8px"><button class="btn light sm" id="qprev">Preview the quote</button><button class="btn sm" id="qsend">${j.quote_sent_at?'Copy the link again':'Mark sent and copy link'}</button><button class="btn light sm" id="qxero">Copy lines for Xero</button></div></div>`;
  $('#back').onclick=()=>go('job',j.id);
  const upd=async(id,k,v)=>{const num=['qty','unit_cost','markup_pct','unit_price'].includes(k);const val=num?(v===''?null:+v):v;
    const {error}=await sb.from('quote_lines').update({[k]:val}).eq('id',id);if(error)return toast(error.message);const l=S.qlines.find(x=>x.id===id);if(l)l[k]=val};
  el.querySelectorAll('tr[data-lid] input').forEach(inp=>inp.onchange=async()=>{const id=inp.closest('tr').dataset.lid,k=inp.dataset.k;
    if(k==='item'){const r=S.rates.find(r=>r.task_type===inp.value);if(r){const l=S.qlines.find(x=>x.id===id);const p={item:r.task_type,unit:l.unit||r.unit};
      const rc=r.material_cost_per_unit!=null?+r.material_cost_per_unit:null,rs=r.sell_rate_per_unit!=null?+r.sell_rate_per_unit:null;if(l.unit_cost==null&&rc!=null){p.unit_cost=rc;if(rs&&l.markup_pct==null)p.markup_pct=Math.round((rs/rc-1)*1000)/10}if(l.unit_price==null&&rs!=null&&rc==null)p.unit_price=rs;if(!l.supplier&&r.supplier)p.supplier=r.supplier;if(!l.description&&r.notes&&/sell rate from Xero/.test(r.notes))p.description=null;
      await sb.from('quote_lines').update(p).eq('id',id);Object.assign(l,p);return render()}}
    await upd(id,k,inp.value);if(k!=='description'&&k!=='supplier')render()});
  el.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=async()=>{await sb.from('quote_lines').delete().eq('id',b.dataset.ldel);S.qlines=S.qlines.filter(x=>x.id!==b.dataset.ldel);render()});
  el.querySelectorAll('[data-ladd]').forEach(b=>b.onclick=async()=>{const k=b.dataset.ladd;const avgCost=()=>{const c=S.crew.filter(c=>c.cost_per_day);return c.length?c.reduce((a,c)=>a+(+c.cost_per_day),0)/c.length:null};
    const base=k==='Labour'?{item:'Labour',unit:'crew days',unit_price:DAY_RATE(),unit_cost:avgCost(),qty:1}:{item:k==='Plant and hire'?'Hire':'New item',qty:1};
    const {data,error}=await sb.from('quote_lines').insert({job_id:j.id,kind:k,seq:q.ls.length,...base}).select().single();if(error)return toast(error.message);S.qlines.push(data);render()});
  $('#labplan').onclick=async()=>{const crew=j.crew_size||S.settings.default_crew||2;const days=j.est_days||planFor(j.id).length||r1(jobHours(tasksFor(j.id))/((S.settings.hours_per_day||8)*crew));
    if(!days)return toast('Add a day plan or tasks first');const cd=Math.round(days*crew*10)/10;const c=S.crew.filter(c=>c.cost_per_day);const cost=c.length?c.reduce((a,c)=>a+(+c.cost_per_day),0)/c.length:null;
    const ex=q.ls.find(l=>l.kind==='Labour'&&/^crew days?$/.test(l.unit||''));
    if(ex){await sb.from('quote_lines').update({qty:cd}).eq('id',ex.id);ex.qty=cd}else{const {data,error}=await sb.from('quote_lines').insert({job_id:j.id,kind:'Labour',seq:q.ls.length,item:'Labour',description:`${days} days on site, ${crew} crew`,qty:cd,unit:'crew days',unit_price:DAY_RATE(),unit_cost:cost}).select().single();if(error)return toast(error.message);S.qlines.push(data)}
    toast(`${cd} crew days`);render()};
  const saveMeta=async extra=>{const p={quote_intro:$('#qi').value||null,quote_exclusions:$('#qe').value||null,quote_valid_until:$('#qv').value||null,deposit_pct:+$('#qdp').value||null,...(extra||{})};
    const {error}=await sb.from('jobs').update(p).eq('id',j.id);if(error){toast(error.message);return false}Object.assign(j,p);return true};
  $('#qsave').onclick=async()=>{if(await saveMeta())toast('Saved')};
  const ensureToken=async()=>{if(j.quote_token)return true;return saveMeta({quote_token:crypto.randomUUID()})};
  $('#qprev').onclick=async()=>{if(!q.ls.length)return toast('Add some lines first');if(await ensureToken())window.open(quoteUrl(j),'_blank')};
  $('#qsend').onclick=async()=>{if(!q.ls.length)return toast('Add some lines first');if(q.sell<=0)return toast('The quote is $0. Check the prices.');
    const first=!j.quote_sent_at;const p={quote_token:j.quote_token||crypto.randomUUID()};
    if(first)Object.assign(p,{quote_sent_at:new Date().toISOString(),quote_date:iso(today0()),quote_no:j.quote_no||'Q'+j.job_no,quote_total:Math.round(q.inc*100)/100,quoted_labour:Math.round(q.labour*100)/100,quoted_materials:Math.round((q.mats+q.plant+q.subs)*100)/100,quoted_crew_days:q.crewDays||null,stage:['Lead','Design'].includes(j.stage)?'Quoted':j.stage});
    if(!(await saveMeta(p)))return;if(first&&p.stage!==j.stage)await sb.from('checkpoints').insert({job_id:j.id,stage:'Quoted',note:'Quote sent from the hub'});
    const fn=(j.clients?.name||'').split(/\s|&/)[0];const msg=`Hi ${fn}, here's your quote from Beck’s Landscaping: ${quoteUrl(j)}\nYou can accept it online. Any questions, call me on 0438 456 320.\nGreg`;
    navigator.clipboard?.writeText(msg).then(()=>toast('Link and message copied. Paste into a text or email.'));await loadAll();render()};
  $('#qxero').onclick=async()=>{await saveMeta();navigator.clipboard?.writeText(quoteXero(j)).then(()=>toast('Copied. Paste into Xero.'))};
}

/* ---------- crew view: plan and tools ---------- */
function crewPlanHtml(j){
  const plan=j.plan||[],tools=j.tools||[];if(!plan.length&&!tools.length)return '';
  const dd=d=>d.work_date||(j.start_date?iso(addWorkDays(parse(j.start_date),d.day_no)):null);
  return `${tools.length?`<div class="card"><h2>Bring</h2><div class="chips" style="margin-top:8px">${tools.map(t=>`<span class="chip on">${esc(t)}</span>`).join('')}</div></div>`:''}
   ${plan.length?`<div class="card"><h2>Day by day</h2>${plan.map(d=>{const dt=dd(d);return `<div style="border-top:1px solid #ece9e1;padding:10px 0;margin-top:6px"><b class="small">Day ${d.day_no}${dt?` · ${fmtD(dt)}`:''}${dt===iso(today0())?' <span class="pill good">Today</span>':''}</b>
     <div class="small" style="margin-top:2px">${esc(d.title||'')}</div>${(d.steps||[]).length?`<ul class="small muted" style="margin:6px 0 0;padding-left:18px">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
     ${(d.tools||[]).length?`<div class="tiny muted" style="margin-top:4px">Bring: ${d.tools.map(esc).join(', ')}</div>`:''}</div>`}).join('')}</div>`:''}`}

/* ---------- suppliers and quote settings (on Rates) ---------- */
function quoteSettingsHtml(){
  if(S.v3===false)return '';
  return `<div class="card"><h2>Quotes</h2><div class="split"><div><label for="smk">Default markup on cost %</label><input id="smk" inputmode="decimal" value="${S.settings.default_markup_pct??25}"></div><div><label for="sdp">Deposit %</label><input id="sdp" inputmode="decimal" value="${S.settings.deposit_pct??30}"></div></div>
   <label for="sqv">Quotes valid for (days)</label><input id="sqv" inputmode="numeric" value="${S.settings.quote_valid_days??30}">
   <label for="sqt">Terms on every quote</label><textarea id="sqt" style="min-height:90px" placeholder="Deposit secures your start date. Balance on completion. Prices valid for 30 days.">${esc(S.settings.quote_terms||'')}</textarea>
   <button class="btn light sm" id="sqsave" style="margin-top:10px">Save</button></div>
  <div class="card"><h2>Suppliers</h2><p class="small muted" style="margin:4px 0 8px">Used on supplier orders. Add cost prices in the table below so quotes show real profit.</p>
   <div style="overflow-x:auto"><table style="min-width:520px"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Account</th></tr></thead><tbody>
   ${(S.suppliers||[]).map(s=>`<tr>${['name','email','phone','account_no'].map(k=>`<td><input data-sup="${s.id}" data-k="${k}" value="${esc(s[k]||'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="row" style="gap:8px;margin-top:8px"><input id="supnew" placeholder="New supplier, e.g. Midland Brick"><button class="btn light sm" id="supadd">Add</button></div></div>`}
function bindQuoteSettings(el){
  if(!$('#sqsave'))return;
  $('#sqsave').onclick=async()=>{const p={default_markup_pct:+$('#smk').value||0,deposit_pct:+$('#sdp').value||0,quote_valid_days:+$('#sqv').value||30,quote_terms:$('#sqt').value||null};const {error}=await sb.from('settings').update(p).eq('id',1);if(error)return toast(error.message);Object.assign(S.settings,p);toast('Saved')};
  el.querySelectorAll('[data-sup]').forEach(i=>i.onchange=async()=>{const {error}=await sb.from('suppliers').update({[i.dataset.k]:i.value||null}).eq('id',i.dataset.sup);toast(error?error.message:'Saved');await loadAll()});
  $('#supadd').onclick=async()=>{const n=$('#supnew').value.trim();if(!n)return;const {error}=await sb.from('suppliers').insert({name:n});if(error)return toast(error.message);await loadAll();render()};
}


/* ---------- marketing approvals: Lauren sends, Greg or Kaitlin approve ---------- */
const CSTAT={Planned:'grey',Drafted:'grey','For approval':'warn',Changes:'bad',Approved:'good',Live:'good',Done:'grey'};
function campOpts(c){if(isStaff())return ['Planned','Drafted','For approval','Changes','Approved','Live','Done'];
  return ['Approved','Live','Done'].includes(c.status)?['Approved','Live','Done']:['Planned','Drafted','For approval',...(c.status==='Changes'?['Changes']:[])]}
function campHtml(c){const canEdit=isStaff()||!['For approval'].includes(c.status);
  return `<div class="camp ${c.goal!=='Brand'?'push':''}" data-camp="${c.id}"><div class="row between" style="gap:8px"><b class="small">${esc(c.title)}</b>
   <select data-cid="${c.id}" style="width:auto;padding:3px 6px;font-size:12px">${campOpts(c).map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div>
   <div class="tiny muted">${esc(c.channel)} · ${esc(c.goal)} · ${esc(c.owner||'')} · <span class="pill ${CSTAT[c.status]||'grey'}" style="font-size:10px">${esc(c.status)}</span></div>
   ${c.detail?`<div class="small" style="margin-top:4px">${esc(c.detail)}</div>`:''}
   ${c.copy?`<div class="small" style="margin-top:6px;padding:8px 10px;background:#fff;border-radius:8px;white-space:pre-wrap">${esc(c.copy)}</div>`:''}
   ${c.asset_url?`<a class="tiny" href="${esc(c.asset_url)}" target="_blank" rel="noopener" style="color:var(--green-2)">Open the image or video</a>`:''}
   ${c.status==='Changes'&&c.review_note?`<div class="small" style="margin-top:6px"><span class="pill bad">Changes</span> ${esc(c.reviewed_by||'')}: ${esc(c.review_note)}</div>`:''}
   ${c.status==='Approved'&&c.reviewed_by?`<div class="tiny muted" style="margin-top:4px">Approved by ${esc(c.reviewed_by)} ${c.reviewed_at?fmtShort(String(c.reviewed_at).slice(0,10)):''}</div>`:''}
   <div class="row wrap" style="gap:6px;margin-top:8px">
    ${isStaff()&&c.status==='For approval'?`<button class="btn sm" data-capp="${c.id}">Approve</button><input data-cnote="${c.id}" placeholder="What to change" style="flex:1;min-width:140px"><button class="btn light sm" data-cchg="${c.id}">Ask for changes</button>`:''}
    ${isMkt()&&['Planned','Drafted','Changes'].includes(c.status)?`<button class="btn sm" data-csend="${c.id}">Send for approval</button>`:''}
    ${canEdit?`<button class="btn light sm" data-cedit="${c.id}">Edit</button>`:''}</div></div>`}
function approvalsCard(){const wait=S.camps.filter(c=>c.status==='For approval'),chg=S.camps.filter(c=>c.status==='Changes'),ok=S.camps.filter(c=>c.status==='Approved');
  if(!wait.length&&!chg.length&&!ok.length)return '';
  return `<div class="card"><div class="row between"><h2>Approvals</h2><span class="small muted">${isStaff()?'Lauren sends, you approve':'Greg or Kaitlin approve'}</span></div>
   <div class="kpis" style="margin-top:10px"><div class="kpi ${wait.length&&isStaff()?'alert':''}"><div class="eyebrow">Waiting</div><div class="v">${wait.length}</div><div class="s">${isStaff()?'Need your yes':'With Greg or Kaitlin'}</div></div>
    <div class="kpi"><div class="eyebrow">Changes asked</div><div class="v">${chg.length}</div><div class="s">${isMkt()?'Back to you':'With Lauren'}</div></div>
    <div class="kpi"><div class="eyebrow">Approved</div><div class="v">${ok.length}</div><div class="s">Ready to go live</div></div></div>
   ${(isStaff()?wait:chg).slice(0,6).map(c=>campHtml(c)).join('')}</div>`}
function bindCamps(el){
  el.querySelectorAll('[data-cid]').forEach(s=>s.onchange=async()=>{const {data,error}=await sb.from('campaigns').update({status:s.value}).eq('id',s.dataset.cid).select().single();if(error){toast(error.message);return render()}const i=S.camps.findIndex(x=>x.id===data.id);if(i>=0)S.camps[i]=data;toast(data.status);render()});
  const setC=async(id,p,msg)=>{const {data,error}=await sb.from('campaigns').update(p).eq('id',id).select().single();if(error)return toast(error.message);const i=S.camps.findIndex(x=>x.id===id);if(i>=0)S.camps[i]=data;toast(msg);render()};
  el.querySelectorAll('[data-capp]').forEach(b=>b.onclick=()=>setC(b.dataset.capp,{status:'Approved',review_note:null},'Approved. Lauren can post it.'));
  el.querySelectorAll('[data-cchg]').forEach(b=>b.onclick=()=>{const n=el.querySelector(`[data-cnote="${b.dataset.cchg}"]`).value.trim();if(!n)return toast('Say what to change');setC(b.dataset.cchg,{status:'Changes',review_note:n},'Sent back to Lauren')});
  el.querySelectorAll('[data-csend]').forEach(b=>b.onclick=()=>setC(b.dataset.csend,{status:'For approval'},'Sent to Greg and Kaitlin'));
  el.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>{const c=S.camps.find(x=>x.id===b.dataset.cedit);const box=el.querySelector(`[data-camp="${c.id}"]`);
    box.innerHTML=`<label>Title</label><input id="ce_t" value="${esc(c.title)}"><label>Caption or copy</label><textarea id="ce_c" style="min-height:90px">${esc(c.copy||'')}</textarea>
     <label>Link to the image or video (Drive, Canva)</label><input id="ce_a" value="${esc(c.asset_url||'')}" placeholder="https://">
     <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" id="ce_s">Save</button>${isMkt()?'<button class="btn light sm" id="ce_sa">Save and send for approval</button>':''}</div>`;
    const p=()=>({title:$('#ce_t').value.trim()||c.title,copy:$('#ce_c').value||null,asset_url:$('#ce_a').value.trim()||null});
    $('#ce_s').onclick=()=>setC(c.id,p(),'Saved');$('#ce_sa')&&($('#ce_sa').onclick=()=>setC(c.id,{...p(),status:'For approval'},'Sent to Greg and Kaitlin'))});
}

/* ---------- me ---------- */
async function viewMe(el){
  el.innerHTML=`<div class="card" style="margin-top:18px"><h2>${esc(S.profile.name||S.user.email)}</h2><p class="small muted">${esc(S.user.email)} · ${esc(role())}</p>
   ${isStaff()?`<div class="row wrap" style="gap:6px;margin:8px 0"><button class="btn light sm" data-go="money">Money</button><button class="btn light sm" data-go="mkt">Marketing</button><button class="btn light sm" id="toRates">Rates and crew</button></div>`:''}<button class="btn ghost sm" id="lo">Log out</button>
   <details style="margin-top:12px"><summary class="small" style="cursor:pointer">Change my password</summary>
    <label for="mp1">New password</label><input id="mp1" type="password" autocomplete="new-password">
    <label for="mp2">Type it again</label><input id="mp2" type="password" autocomplete="new-password">
    <button class="btn light sm" id="mpgo" style="margin-top:10px">Save</button></details></div>
  ${isStaff()?`<div class="card"><h2>Team</h2><p class="small muted" style="margin:4px 0 8px">Who can see what. Crew see jobs, the board and toolbox, no money or client contacts. Marketing sees the board, enquiries and campaigns, no money.</p><div id="team"><div class="spinner"></div></div></div>`:''}
  <div class="card small muted">Add to home screen: tap Share, then Add to Home Screen.</div>`;
  $('#mpgo').onclick=async()=>{const a=$('#mp1').value,b=$('#mp2').value;if(a.length<8)return toast('Use at least 8 characters');if(a!==b)return toast('They don’t match');const {error}=await sb.auth.updateUser({password:a});toast(error?error.message:'Password changed');if(!error){$('#mp1').value='';$('#mp2').value=''}};
  $('#lo').onclick=()=>sb.auth.signOut();$('#toRates')&&($('#toRates').onclick=()=>go('rates'));el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(!isStaff())return;
  const {data:people}=await sb.from('profiles').select('*').order('created_at');
  const asked=new Set((S.alog||[]).filter(l=>l.action==='reset_request'&&!l.checked_at).map(l=>l.ref));
  $('#team').innerHTML=(people||[]).map(p=>`<div style="padding:8px 0;border-bottom:1px solid #ece9e1"><div class="row between" style="gap:8px"><b class="small">${esc(p.name||'')}${asked.has((p.name||'').toLowerCase())?' <span class="pill warn">Asked for a reset</span>':''}</b>
   <div class="row" style="gap:6px">${p.id===S.user.id?'':`<button class="btn light sm" data-rp="${p.id}">Reset password</button>`}<select data-pid="${p.id}" style="width:auto" ${p.id===S.user.id?'disabled':''}>${['pending','crew','marketing','admin','owner'].map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select></div></div>
   <div class="hidden" id="rpb-${p.id}" style="margin-top:8px"><div class="row" style="gap:8px"><input type="text" id="rpi-${p.id}" placeholder="New password, 8 or more" autocomplete="off" style="flex:1"><button class="btn sm" data-rps="${p.id}">Set it</button></div><p class="tiny muted" style="margin:6px 0 0">You choose it, then text it to ${esc(p.name||'them')}. They can change it under their name.</p></div></div>`).join('');
  el.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{$('#rpb-'+b.dataset.rp).classList.toggle('hidden');$('#rpi-'+b.dataset.rp).focus()});
  el.querySelectorAll('[data-rps]').forEach(b=>b.onclick=async()=>{const id=b.dataset.rps,pw=$('#rpi-'+id).value;if(pw.length<8)return toast('Use at least 8 characters');b.disabled=true;
    const {data,error}=await sb.functions.invoke('admin-set-password',{body:{user_id:id,password:pw}});b.disabled=false;
    const emsg=await fnErr(data,error);if(emsg)return toast(emsg);$('#rpi-'+id).value='';$('#rpb-'+id).classList.add('hidden');toast(`New password set for ${data.name}. Text it to them.`);await loadAll()});
  el.querySelectorAll('[data-pid]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('profiles').update({role:s.value}).eq('id',s.dataset.pid);toast(error?error.message:'Updated')});
}

boot();
</script>
